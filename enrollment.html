<script type="module">
// The full-depth engine ships as an in-repo, content-addressed bundle split into
// 27 chunks (GitHub API write limits). Reassemble the exact bytes, then execute.
const N=27;
const names=[...Array(N)].map((_,i)=>'assets/bk-'+String(i).padStart(2,'0')+'.js');
const el=document.getElementById('loading');
try{
  const texts=await Promise.all(names.map(async n=>{
    const r=await fetch(n);
    if(!r.ok)throw new Error(n+' → HTTP '+r.status);
    return r.text();
  }));
  const blob=new Blob(texts,{type:'text/javascript'});
  await import(URL.createObjectURL(blob));
}catch(e){
  el.innerHTML='The full engine could not be assembled in this deployment ('+String(e.message||e)+'). '+
    '<a href="https://buildingkidenrollment.netlify.app">Open the hosted original →</a>';
}
</script>
