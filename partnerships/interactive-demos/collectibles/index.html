<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Senior Night Display Studio | APERTURE</title><style>*{box-sizing:border-box}body{margin:0;background:#141c20;color:#f4f1e8;font:17px/1.5 system-ui}main{max-width:940px;margin:auto;padding:24px}h1{font:clamp(42px,7vw,75px)/1 Georgia;margin:.3em 0}a{color:#f6c68d}section{background:#233035;border-radius:18px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:20px}label{display:block;margin:12px 0}input,select,button{font:inherit;padding:8px;max-width:100%}input[type=number]{width:100px}svg{width:100%;display:block;background:#18282d;border-radius:12px}output{display:block;color:#ffdfac;font-weight:bold}button{border:0;border-radius:8px;background:#ffcf8f}small{color:#e9cead}</style><main><a href="../">APERTURE partner studio</a><h1>Senior night, framed.</h1><p>Arrange a keepsake, test the wall fit and build a budget for a display maker.</p><div class="grid"><section><svg viewBox="0 0 320 350" role="img" aria-label="Custom case with selected keepsakes"><defs><linearGradient id="wall" x2="1" y2="1"><stop stop-color="#53646a"/><stop offset="1" stop-color="#273036"/></linearGradient><linearGradient id="glow" x2="0" y2="1"><stop id="lightcolor" stop-color="#ffe7a3" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><radialGradient id="leather"><stop stop-color="#f49553"/><stop offset="1" stop-color="#a54b28"/></radialGradient></defs><rect width="320" height="350" fill="url(#wall)"/><g id="case"><rect x="32" y="25" width="256" height="292" rx="4" fill="#845a38"/><rect x="40" y="33" width="240" height="276" fill="#172427"/><g id="jersey"><path id="cloth" d="m132 58 15 6q13 18 26 0l15-6 16 39-17 12v91h-54v-91l-17-12z" fill="#5c80bc" stroke="#e8e4ca" stroke-width="3"/><text id="digits" x="160" y="151" text-anchor="middle" font-size="34" fill="#fff" font-weight="bold">23</text></g><g id="ball"><circle cx="160" cy="244" r="36" fill="url(#leather)" stroke="#422e25"/><path d="M124 244h72m-36-36v72m-20-65q32 29 0 59m40-59q-32 29 0 59" fill="none" stroke="#493026" stroke-width="2"/></g><path id="beam" d="M61 36h198l18 247H42z" fill="url(#glow)"/><rect x="92" y="287" width="136" height="13" rx="2" fill="#cba978"/><text x="160" y="297" text-anchor="middle" font-size="8" fill="#28231e">SENIOR NIGHT</text></g></svg><p id="size"></p></section><section><label>Keepsake <select id="kind"><option>Jersey and ball</option><option>Jersey only</option><option>Basketball only</option></select></label><label>Jersey color <input type="color" id="color" value="#5c80bc"></label><label>Number <input id="num" maxlength="2" value="23" pattern="[0-9]{1,2}"></label><label>Display lighting <select id="lighting"><option>Warm LED</option><option>Cool LED</option><option>Ambient only</option></select></label><label>Available wall width, inches <input type="number" id="space" value="36" min="1" step=".1"></label><output id="fit"></output></section></div><section><h2>Price the display</h2><p>Editable sample costs in USD for one display. Keepsakes, tax, installation and shipping are excluded.</p><label>Frame and backing $ <input type="number" id="frameCost" min="0" step=".01" value="95"></label><label>Mount per item $ <input type="number" id="mount" min="0" step=".01" value="18"></label><label>LED kit $ <input type="number" id="led" min="0" step=".01" value="30"></label><output id="cost"></output><button id="save">Download display brief</button></section></main><script>
const el=id=>document.getElementById(id);let brief='';
function redraw(){const k=el('kind').selectedIndex,l=el('lighting').selectedIndex,width=[32,26,16][k],height=[40,34,16][k],depth=[12,4,12][k];el('jersey').style.display=k===2?'none':'';el('ball').style.display=k===1?'none':'';el('jersey').setAttribute('transform',k===1?'translate(-48 0) scale(1.3)':'');el('ball').setAttribute('transform',k===2?'translate(-128 -269) scale(1.8)':'');el('case').setAttribute('transform',k===2?'translate(48 35) scale(.7)':'');el('beam').style.display=l===2?'none':'';el('lightcolor').setAttribute('stop-color',l===0?'#ffe7a3':'#a4deff');el('cloth').setAttribute('fill',el('color').value);el('digits').textContent=el('num').value;el('size').textContent='Concept case: '+width+'″ wide × '+height+'″ high × '+depth+'″ deep.';const valid=['space','frameCost','mount','led','num'].every(id=>el(id).value!==''&&el(id).validity.valid);el('save').disabled=!valid;if(!valid){el('cost').textContent='Check the dimensions, number and costs.';el('fit').textContent='';return}const room=el('space').valueAsNumber-width;el('fit').textContent=room>=0?room.toFixed(1)+'″ horizontal clearance.':'Needs '+(-room).toFixed(1)+'″ more wall width.';const n=k===0?2:1,frame=el('frameCost').valueAsNumber,mount=n*el('mount').valueAsNumber,led=l===2?0:el('led').valueAsNumber;el('cost').textContent='Estimated total: $'+(frame+mount+led).toFixed(2);brief=['APERTURE collectible display concept',el('kind').value,el('size').textContent,'Wall width: '+el('space').value+' inches',el('fit').textContent,'Lighting: '+el('lighting').value,...(k===2?[]:['Jersey: #'+el('num').value+' · '+el('color').value]),'Frame $'+frame+' · mounts $'+mount+' · lighting $'+led,el('cost').textContent,'Illustrative only. Confirm actual item dimensions, mounting and installed price with a display maker.'].join('\n')}
document.addEventListener('input',redraw);el('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([brief],{type:'text/plain'}));a.download='senior-night-display.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};redraw()</script></html>
