<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Builder · APERTURE</title><style>*{box-sizing:border-box}body{margin:0;background:#102025;color:#f7f4e7;font:17px/1.5 system-ui}main{max-width:1000px;margin:auto;padding:24px}h1{font:clamp(36px,7vw,72px)/1 Georgia}label{display:block;margin:.7em 0 .2em}input,select,textarea,button{font:inherit;padding:8px;border-radius:6px;max-width:100%}input,textarea{width:100%}a{color:#deff99}button{background:#deff99;color:#16302a;border:0;cursor:pointer}iframe{width:100%;height:600px;border:1px solid #567272;border-radius:12px;background:white}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button[aria-pressed=true]{background:white}details{margin:16px 0}small{color:#c5d7cf}</style><main><small>APERTURE / WORLD BUILDER</small><h1 id="title">Design a team experience</h1><p id="intro"></p><details id="editor" open><summary>Edit this world</summary><label for="name">World name</label><input id="name" maxlength="80" value="Design a team experience"><label for="goal">What should visitors accomplish?</label><input id="goal" maxlength="160" value="Choose a game-night setup and design a team gift."><fieldset><legend>Choose experiences</legend><div id="choices"></div></fieldset><button id="share">Create visitor link</button><input id="url" hidden readonly aria-label="Visitor link"><p id="msg" role="status"></p></details><nav id="nav"></nav><iframe id="stage" title="Selected experience"></iframe><p><a id="full">Open this experience on its own</a> · <a href="../world-builder/">Create a new world</a></p></main><script>const catalog=[['Arena','../../../prototypes/game-night/?embed=1'],['Team shirt','../../../gifts/team-shirt/'],['Product showroom','../3d/?embed=1'],['Neighborhood tour','../../../prototypes/realtor/'],['Sound lab','../../../prototypes/car-audio/'],['Court planner','../court-planner/'],['Collectibles','../collectibles/'],['Clubhouse','../clubhouse/']];const e=id=>document.getElementById(id),q=new URLSearchParams(location.hash.slice(1));let ids=q.has('stops')?[...new Set(q.get('stops').split(',').filter(i=>/^[0-7]$/.test(i)).map(Number))]:[0,1];if(!ids.length)ids=[0];if(q.has('name')){e('name').value=q.get('name').slice(0,80);e('goal').value=(q.get('goal')||'').slice(0,160);e('editor').open=false}let active=ids[0];function draw(){e('title').textContent=e('name').value.trim()||'Untitled world';e('intro').textContent=e('goal').value;e('nav').replaceChildren();if(!ids.includes(active))active=ids[0];for(const i of ids){let b=document.createElement('button');b.textContent=catalog[i][0];b.setAttribute('aria-pressed',String(active===i));b.onclick=()=>{active=i;draw()};e('nav').append(b)}let src=new URL(catalog[active][1],location.href).href;if(e('stage').src!==src)e('stage').src=src;e('stage').title=catalog[active][0];e('full').href=src;e('url').hidden=true}catalog.forEach(([label],i)=>{let l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.style.width='auto';c.checked=ids.includes(i);c.onchange=()=>{if(!c.checked&&ids.length===1){c.checked=true;e('msg').textContent='Keep at least one experience.';return}ids=c.checked?[...ids,i]:ids.filter(k=>k!==i);e('msg').textContent='';draw()};l.append(c,' '+label);e('choices').append(l)});e('name').oninput=e('goal').oninput=draw;e('share').onclick=async()=>{const u=new URL(location.href);u.hash=new URLSearchParams({name:e('title').textContent,goal:e('goal').value,stops:ids.join(',')}).toString();e('url').hidden=false;e('url').value=u.href;try{await navigator.clipboard.writeText(u.href);e('msg').textContent='Visitor link copied.'}catch{e('url').select();e('msg').textContent='Copy the selected visitor link.'}};draw()</script></html>
