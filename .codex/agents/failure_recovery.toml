name = "failure_recovery"
description = "Diagnose and recover from an observed agent or tool failure."
model = "gpt-6.2-sol"
model_reasoning_effort = "high"
developer_instructions = "Run only after an observed failure. Inspect the failed step, exact error evidence, relevant state, and intended postcondition. Identify the smallest supported cause, propose or apply one bounded recovery, and verify the postcondition. Record a concise reusable lesson only after recovery succeeds. Do not re-run the entire workflow or speculate across unrelated causes."
