<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a1425"><title>APERTURE ∞ | Pathways Intelligence</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#e9f0fc;background:#0a1425}*{box-sizing:border-box}body{margin:0}header{padding:22px max(18px,calc((100vw - 1100px)/2));background:#101e33;border-bottom:1px solid #2b405b}h1{font-size:clamp(26px,4vw,40px);margin:5px 0}h2{font-size:22px}h3{font-size:17px;margin:8px 0}.muted,small{color:#a9bdd4}small{display:block;line-height:1.5}.badge{display:inline-block;padding:5px 10px;border:1px solid #426785;border-radius:99px;font-size:12px;margin:3px 5px 3px 0}.shell{max-width:1100px;margin:auto;padding:20px}.nav{display:flex;gap:7px;overflow-x:auto;padding:10px 0 18px;position:sticky;top:0;background:#0a1425;z-index:3}button,select,input,textarea{font:inherit}button{background:#203650;color:#e9f0fc;border:1px solid #3c5876;border-radius:10px;padding:11px 14px;cursor:pointer}button.active,.primary{background:#2778c4;border-color:#4da0ee;color:white}button:disabled{opacity:.45;cursor:not-allowed}.nav button{white-space:nowrap}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7ec8ff}main{min-height:460px}.card{background:#14243a;border:1px solid #30455f;border-radius:16px;padding:18px;margin:12px 0}.soft{background:#1c3048}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.grid .card{margin:0}.metric{font-size:30px;font-weight:750;margin:5px 0}.field{margin:15px 0}label{display:block;margin-bottom:7px;color:#d6e6f7}input:not([type=checkbox]),select,textarea{width:100%;background:#0d1b2d;border:1px solid #506780;border-radius:9px;color:#fff;padding:11px}input[type=range]{width:100%;accent-color:#51a7f2}textarea{min-height:85px}progress{width:100%;height:12px;accent-color:#4eacdf}.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grow{flex:1}.tag{font-size:12px;color:#a6dcff}.warning{border-left:4px solid #e6aa60}.success{border-left:4px solid #6fce9c}.graphnode{display:block;width:100%;margin:7px 0;text-align:left}.court{background:#19483f;border:2px solid #91c7b6;border-radius:14px;min-height:185px;position:relative;overflow:hidden}.court:before{content:"";position:absolute;width:100px;height:100px;border:2px solid #a3d5c5;border-radius:50%;left:calc(50% - 50px);top:40px}.court:after{content:"";position:absolute;width:100%;border-top:2px solid #a3d5c5;top:92px}.shot{position:absolute;width:12px;height:12px;border-radius:50%;z-index:1;border:1px solid white}.good{background:#78db9a}.bad{background:#ef8980}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{background:#244462;border-radius:20px;padding:5px 10px}footer{padding:22px;text-align:center;color:#a9bdd4;border-top:1px solid #2b405b}@media(max-width:600px){.shell{padding:12px}.card{padding:14px}.nav{margin:0 -12px;padding-left:12px;padding-right:12px}}
</style></head><body><header><div class="tag">APERTURE / HUMAN DEVELOPMENT OS</div><h1>Pathways Intelligence ∞</h1><div class="muted">Evidence → Learning → Service → Well-being</div><p><span class="badge">10 interactive modules</span><span class="badge">Fictional learners only</span><span class="badge">Inclusive principles</span></p></header><div class="shell"><nav id="nav" class="nav" aria-label="Modules"></nav><main id="app"></main></div><footer>APERTURE demonstration · No external referrals · No real student intake · No religious affiliation required</footer><script>
"use strict";
const modules=[["learning","Adaptive Learning"],["graph","Skill Graph"],["sports","Sports Lab"],["decisions","Decisions"],["family","Collaboration"],["agents","Agents"],["governance","Governance"],["privacy","Privacy"],["business","Business"],["impact","Impact"]];
const seed=[{name:"Alex Morgan",track:"AI & Coding",mastery:62,confidence:55,pace:65},{name:"Jordan Lee",track:"Sports Analytics",mastery:81,confidence:72,pace:80},{name:"Taylor Brooks",track:"Game Development",mastery:38,confidence:45,pace:50},{name:"Casey Rivera",track:"Robotics",mastery:90,confidence:80,pace:75}];
const nodes=[["Programming Logic",[]],["Python Fundamentals",[0]],["Data Analysis",[1]],["Responsible AI",[2]],["Capstone Project",[3]]];
const options=[{name:"Current school + coding",flex:45,cost:90,academic:75,stability:95},{name:"Coordinated hybrid plan",flex:75,cost:65,academic:80,stability:75},{name:"Explore flexible programs",flex:95,cost:40,academic:60,stability:40}];
const principles=[["Truth","Require evidence before claiming mastery or eligibility."],["Service","Encourage useful work that benefits others."],["Humility","Invite feedback and correct unsupported recommendations."],["Fairness","Disclose incentives and consider accessible alternatives."],["Awareness","Respect real learner circumstances."],["Well-being","Prioritize student welfare over conversion."]];
const S={tab:"learning",students:structuredClone(seed),person:0,skills:[0],node:1,shots:[],range:"mid",defense:"light",focus:50,weights:{flex:30,cost:25,academic:25,stability:20},chosen:-1,notes:[],role:"Student",agent:0,policy:0,policyOutcome:"",consent:[false,false,false,false,false],centers:3,adoption:60,monthly:149,setup:500,cycles:0,events:["Demo initialized"],selectedPrinciple:0};
const el=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const btn=(label,fn,cls="")=>'<button class="'+cls+'" data-act="'+fn+'">'+label+'</button>';
const slider=(label,key,value)=>'<div class="field"><div class="row"><label for="'+key+'">'+label+'</label><b id="v-'+key+'">'+value+'</b></div><input type="range" min="0" max="100" step="5" id="'+key+'" value="'+value+'" data-slide="'+key+'"></div>';
const studentSelect=()=>'<div class="field"><label for="person">Fictional learner</label><select id="person" data-select="person">'+S.students.map((p,i)=>'<option value="'+i+'" '+(i===S.person?"selected":"")+'>'+esc(p.name)+" · "+esc(p.track)+'</option>').join("")+'</select></div>';
const card=(s,cls="")=>'<section class="card '+cls+'">'+s+'</section>';
const log=s=>S.events.unshift(s);
const score=o=>Math.round(Object.keys(S.weights).reduce((n,k)=>n+o[k]*S.weights[k],0)/Math.max(1,Object.values(S.weights).reduce((a,b)=>a+b,0)));
function render(){el("nav").innerHTML=modules.map(([id,name],i)=>btn((i+1)+". "+name,"tab:"+id,S.tab===id?"active":"")).join("");const p=S.students[S.person];let h="";
if(S.tab==="learning"){const advice=p.mastery<50?"Build foundations with guided examples and independent explanations.":p.confidence<60?"Use smaller projects, constructive feedback and achievable demonstrations.":p.pace<50?"Reduce workload without lowering mastery standards.":p.mastery>=80?"Introduce advanced testing, reflection and peer feedback.":"Advance to an applied project with evidence checkpoints.";h='<h2>01 · Adaptive Learning</h2>'+studentSelect()+'<div class="grid">'+["mastery","confidence","pace"].map(k=>card('<small>'+k.toUpperCase()+'</small><div class="metric">'+p[k]+'%</div>')).join("")+'</div>'+["mastery","confidence","pace"].map(k=>slider(k[0].toUpperCase()+k.slice(1),"learner:"+k,p[k])).join("")+card('<h3>Adaptive recommendation</h3><p>'+advice+'</p><small>Rule-based recommendation, not a validated AI learner model.</small>','success');}
if(S.tab==="graph"){h='<h2>02 · Skill Dependency Graph</h2><p class="muted">Select a skill and inspect prerequisites. Unlocking is a manual demonstration, not verified mastery.</p>'+card(nodes.map((n,i)=>btn((S.skills.includes(i)?"✓ ":"○ ")+n[0],"node:"+i,S.node===i?"active graphnode":"graphnode")).join('<div style="text-align:center">↓</div>'))+card('<h3>'+nodes[S.node][0]+'</h3><p>Prerequisites: '+(nodes[S.node][1].map(i=>nodes[i][0]).join(", ")||"None")+'</p>'+btn(S.skills.includes(S.node)?"Already demonstrated (demo)":"Mark demonstrated (demo)","unlock",S.skills.includes(S.node)||!nodes[S.node][1].every(i=>S.skills.includes(i))?"disabled":"primary"));}
if(S.tab==="sports"){const chance=Math.max(5,Math.min(95,(S.range==="close"?75:S.range==="mid"?53:36)-(S.defense==="none"?0:S.defense==="light"?12:26)+(S.focus-50)*.25));h='<h2>03 · Basketball Probability Lab</h2>'+card('<div class="court">'+S.shots.map((s,i)=>'<div class="shot '+(s.made?"good":"bad")+'" style="left:'+(20+(i*19)%65)+'%;top:'+(15+(i*31)%70)+'%"></div>').join("")+'</div><p>Made: '+S.shots.filter(x=>x.made).length+' / '+S.shots.length+'</p>')+'<div class="grid">'+card('<label>Shot range</label><select data-select="range">'+["close","mid","three"].map(x=>'<option '+(S.range===x?"selected":"")+' value="'+x+'">'+x+'</option>').join("")+'</select>')+card('<label>Defense</label><select data-select="defense">'+["none","light","heavy"].map(x=>'<option '+(S.defense===x?"selected":"")+' value="'+x+'">'+x+'</option>').join("")+'</select>')+'</div>'+slider("Focus","focus",S.focus)+card('<div class="metric">'+Math.round(chance)+'%</div><small>Modeled shot probability. Hand-authored approximation; no 3D physics or validated coaching AI.</small>')+btn("Simulate shot","shot","primary")+" "+btn("Clear shots","clearshots");}
if(S.tab==="decisions"){h='<h2>04 · Decision Comparison</h2><p class="muted">All scores are invented illustrative assumptions, not verified school costs, eligibility, or academic quality.</p>'+Object.keys(S.weights).map(k=>slider(k[0].toUpperCase()+k.slice(1),"weight:"+k,S.weights[k])).join("")+options.map((o,i)=>card('<div class="row"><h3>'+o.name+'</h3><div class="metric">'+score(o)+'</div></div><progress max="100" value="'+score(o)+'"></progress><p><small>Evidence incomplete. Selection is for investigation, not enrollment.</small></p>'+btn(S.chosen===i?"Selected":"Select for review","choose:"+i,S.chosen===i?"active":""))).join("")+(S.chosen>=0?card('<label for="reason">Reasoning and missing evidence</label><textarea id="reason" placeholder="Document evidence, trade-offs, unknowns, and alternatives..."></textarea>'+btn("Record review","record","primary")):"");}
if(S.tab==="family"){h='<h2>05 · Collaborative Workspace</h2>'+studentSelect()+card('<label>Perspective</label><select data-select="role">'+["Student","Family","Coach","Director"].map(r=>'<option '+(S.role===r?"selected":"")+'>'+r+'</option>').join("")+'</select><p class="muted">Role selection changes the view only; it is not authentication.</p>')+S.notes.map(n=>card('<small>'+esc(n.role)+'</small><p>'+esc(n.text)+'</p>')).join("")+card('<label for="note">Shared observation or question</label><textarea id="note" placeholder="Describe a goal, concern or recommendation..."></textarea>'+btn("Add discussion note","note","primary"));}
if(S.tab==="agents"){const steps=["Learning planner","Evidence reviewer","Opportunity researcher","Fairness auditor","Human approver"];h='<h2>06 · Workflow Orchestration</h2><p class="muted">A deterministic demonstration of agent responsibilities. No live AI agents or external searches are running.</p>'+steps.map((s,i)=>card('<div class="row"><div><h3>'+(i<S.agent?"✓ ":"")+s+'</h3><small>'+(i<S.agent?"Simulated task complete":i===S.agent?"Awaiting action":"Waiting for previous task")+'</small></div>'+(i===S.agent?btn(i===4?"Simulate human approval":"Run simulated check","agent","primary"):"")+'</div>')).join("")+btn("Restart workflow","restartagents");}
if(S.tab==="governance"){h='<h2>07 · Human-Centered Governance</h2><div class="grid">'+principles.map((r,i)=>card(btn(r[0],"principle:"+i,S.selectedPrinciple===i?"active":"")+'<small>'+r[1]+'</small>')).join("")+'</div>'+card('<h3>Test a decision rule</h3><select data-select="policy">'+["Claim mastery without evidence","Prioritize a referral commission","Propose an affordable alternative","Revise using new evidence"].map((x,i)=>'<option value="'+i+'" '+(S.policy===i?"selected":"")+'>'+x+'</option>').join("")+'</select><p>'+btn("Evaluate decision","policytest","primary")+'</p>'+(S.policyOutcome?'<div class="card '+(S.policyOutcome.startsWith("BLOCK")?"warning":"success")+'">'+esc(S.policyOutcome)+'</div>':""));}
if(S.tab==="privacy"){h='<h2>08 · Privacy & Consent Gates</h2><p class="muted">Demo checkboxes do not verify guardian identity, legal permission, eligibility, or security.</p>'+["Identity checked (simulation)","Relationship checked (simulation)","Specific permission (simulation)","Academic eligibility (simulation)","Human review (simulation)"].map((s,i)=>card('<label><input type="checkbox" data-check="'+i+'" '+(S.consent[i]?"checked":"")+'/> '+s+'</label>')).join("")+card('<h3>'+(S.consent.every(Boolean)?"Demo gates complete":"Demo gates incomplete")+'</h3><small>No real student information can be shared through this prototype.</small>')+btn("Revoke demo flags","revoke");}
if(S.tab==="business"){const active=Math.round(S.centers*S.adoption/100);h='<h2>09 · Multi-Center Economics</h2>'+slider("Potential centers","centers",S.centers)+slider("Modeled adoption %","adoption",S.adoption)+card('<label>Monthly fee / center ($)</label><input type="number" min="0" data-number="monthly" value="'+S.monthly+'"><label>One-time setup / center ($)</label><input type="number" min="0" data-number="setup" value="'+S.setup+'">')+'<div class="grid">'+[["Modeled customers",active],["Monthly revenue","$"+(active*S.monthly).toLocaleString()],["Annual run rate","$"+(active*S.monthly*12).toLocaleString()],["One-time setup","$"+(active*S.setup).toLocaleString()]].map(x=>card('<small>'+x[0]+'</small><div class="metric">'+x[1]+'</div>')).join("")+'</div><small>Illustrative only. Excludes churn, costs, refunds and capacity. Revenue never influences student pathway scores.</small>';}
if(S.tab==="impact"){const avg=k=>Math.round(S.students.reduce((a,p)=>a+p[k],0)/S.students.length);h='<h2>10 · Continuous Impact Review</h2><div class="grid">'+[["Learners",S.students.length],["Average mastery",avg("mastery")+"%"],["Average confidence",avg("confidence")+"%"],["Review cycles",S.cycles]].map(x=>card('<small>'+x[0]+'</small><div class="metric">'+x[1]+'</div>')).join("")+'</div>'+card('<h3>Mastery distribution</h3>'+S.students.map(p=>'<p>'+esc(p.name)+' · '+p.mastery+'%</p><progress max="100" value="'+p.mastery+'"></progress>').join(""))+card('<h3>Observe → Hypothesize → Test → Review</h3><p>Simulate an evaluation cycle. No causal impact is inferred.</p>'+btn("Run simulated review","cycle","primary"))+card('<h3>Session audit</h3>'+S.events.slice(0,12).map(e=>'<p><small>'+esc(e)+'</small></p>').join(""));}
el("app").innerHTML=h;const disabled=el("app").querySelector('button.disabled');if(disabled)disabled.disabled=true;
}
function action(a){const [type,arg]=a.split(":");if(type==="tab")S.tab=arg;if(type==="node")S.node=+arg;if(type==="unlock"&&nodes[S.node][1].every(i=>S.skills.includes(i))&&!S.skills.includes(S.node)){S.skills.push(S.node);log("Skill marked demonstrated (demo)");}if(type==="shot"){const prob=Math.max(5,Math.min(95,(S.range==="close"?75:S.range==="mid"?53:36)-(S.defense==="none"?0:S.defense==="light"?12:26)+(S.focus-50)*.25));S.shots.push({made:Math.random()*100<prob});}if(type==="clearshots")S.shots=[];if(type==="choose")S.chosen=+arg;if(type==="record"){const v=el("reason")?.value.trim();if(!v||v.length<15){alert("Record at least 15 characters of reasoning.");return;}log("Pathway selected for investigation: "+options[S.chosen].name+" — "+v);S.tab="governance";}if(type==="note"){const v=el("note")?.value.trim();if(v){S.notes.push({role:S.role,text:v});log("Demo discussion note added");}}if(type==="agent"){S.agent=Math.min(5,S.agent+1);log("Simulated workflow step completed");}if(type==="restartagents")S.agent=0;if(type==="principle")S.selectedPrinciple=+arg;if(type==="policytest"){S.policyOutcome=["BLOCKED: unsupported mastery claim.","BLOCKED: commercial incentive cannot determine student welfare.","REVIEW: verify suitability and access.","PASS: evidence-based correction is permitted."][S.policy];log("Governance simulation: "+S.policyOutcome);}if(type==="revoke"){S.consent=S.consent.map(()=>false);log("Demo permissions revoked");}if(type==="cycle"){S.cycles++;log("Simulated review cycle completed; no measured causal impact");}render();}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b&&!b.disabled)action(b.dataset.act);});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.select){const k=t.dataset.select;S[k]=k==="person"?+t.value:t.value;render();}if(t.dataset.check!==undefined){S.consent[+t.dataset.check]=t.checked;render();}if(t.dataset.number){S[t.dataset.number]=Math.max(0,Number(t.value)||0);render();}});
document.addEventListener("input",e=>{const t=e.target;if(!t.dataset.slide)return;const [kind,key]=t.dataset.slide.split(":");const v=+t.value;if(kind==="learner")S.students[S.person][key]=v;else if(kind==="weight")S.weights[key]=v;else if(kind==="centers")S.centers=Math.max(1,v);else S[kind]=v;render();});
render();
</script></body></html>
