<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build your athlete week · APERTURE</title><style>*{box-sizing:border-box}body{max-width:760px;margin:5vh auto;padding:24px;font:18px/1.55 system-ui;color:#102f35;background:#f6f4eb}h1{font: bold clamp(38px,8vw,66px)/1.03 Georgia;margin:.4em 0}fieldset,article{padding:20px;margin:18px 0;border:1px solid #8baba4;border-radius:12px;background:white}label{display:block;margin:8px 0}select,input,button{font:inherit;padding:8px;max-width:100%}button{background:#174d45;color:white;border:0;border-radius:6px;cursor:pointer}small{color:#42605a}@media print{button{display:none}}</style><main><small>APERTURE · STUDENT-ATHLETE LAB</small><h1>Build your athlete week.</h1><p>Your team travels Thursday. An assignment is due Friday. Can you make a plan that leaves room for practice, school and recovery?</p><form id="lab"><fieldset><legend>1. Choose your goal</legend><label>What matters most this week? <select id="goal"><option>Finish an assignment before travel</option><option>Keep a consistent recovery routine</option><option>Prepare for competition</option></select></label></fieldset><fieldset><legend>2. Allocate six flexible half-hour blocks</legend><label>Schoolwork <select id="school"></select></label><label>Practice <select id="practice"></select></label><label>Recovery or buffer <select id="rest"></select></label><output id="balance" aria-live="polite"></output></fieldset><fieldset><legend>3. Try a disruption</legend><label><input type="checkbox" id="delay"> The bus is late. Lose one flexible block.</label><label>What would you move first, and why?<br><input id="reason" placeholder="I'd move … because …" size="48" required maxlength="220"></label></fieldset><button>Test my plan</button></form><article id="result" hidden aria-live="polite"></article><button onclick="print()">Print worksheet</button></main><script>
const by=id=>document.getElementById(id);
const ids=['school','practice','rest'];
ids.forEach((id,i)=>{for(let n=0;n<=6;n++)by(id).add(new Option(n,n));by(id).value=[3,2,1][i]});
function counts(){return ids.map(id=>Number(by(id).value))}
function balance(){const diff=6-Number(by('delay').checked)-counts().reduce((a,b)=>a+b,0);by('balance').textContent=diff===0?'Every block has a job.':diff>0?diff+' unassigned block(s).':Math.abs(diff)+' block(s) over budget.';return diff}
by('lab').oninput=()=>{balance();by('result').hidden=true};balance();
by('lab').onsubmit=e=>{e.preventDefault();const d=balance(),[s,p,r]=counts();const message=d<0?'Revise your plan. Move or shorten an activity to fit the available time.':s===0?'What happens to the Friday assignment? Try reserving a schoolwork block.':r===0?'Where would a delay fit? Try protecting one buffer block.':p===0?'You protected schoolwork and recovery. Explain how you will coordinate the missed practice with your coach.':'Your plan fits. Compare it with a teammate’s plan and explain one trade-off.';const el=by('result');el.hidden=false;el.textContent=message+' Your goal: '+by('goal').value+'. Your reasoning: '+by('reason').value;el.scrollIntoView({block:'nearest'})}
</script></html>
