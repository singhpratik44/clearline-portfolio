<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APERTURE ∞ — Experience Engine</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#070c16;color:#edf5ff;font:14px system-ui}#viewport{position:fixed;inset:0}header{position:fixed;top:14px;left:14px;right:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:none}header>*{pointer-events:auto}.panel{background:#091523e8;border:1px solid #ffffff29;backdrop-filter:blur(16px);border-radius:18px;padding:14px}h1{font-size:17px;margin:0 0 4px}.muted{color:#a8b9cb;font-size:12px}select,button{background:#1a2c40;color:white;border:1px solid #ffffff35;padding:10px;border-radius:11px;cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #9be8d3}button.active{background:#8ce5ce;color:#08201a}#info{position:fixed;left:14px;bottom:14px;max-width:360px}#info p{margin:7px 0;color:#c3d0de}#info strong{font-size:16px}#metrics{position:fixed;right:14px;bottom:14px;font:12px ui-monospace,monospace}#fallback{display:none;position:fixed;inset:0;background:#101a29;padding:25vh 20px;text-align:center}body.error #fallback{display:block}body.error #viewport{display:none}@media(max-width:620px){header{top:8px;left:8px;right:8px}.panel{padding:10px}#info{left:8px;right:8px;bottom:8px;max-width:none}#metrics{top:130px;bottom:auto;right:8px}select,button{padding:8px;font-size:12px}}</style></head>
<body><div id="viewport" aria-label="Interactive three-dimensional experience"></div><header><div class="panel"><h1>APERTURE ∞ / Experience Engine</h1><div class="muted">Four experiences · one reusable 3D runtime</div></div><div class="panel"><label for="mode">Experience </label><select id="mode"><option value="sports">Sports</option><option value="education">Education</option><option value="gifts">Gifts</option><option value="commercial">Commercial</option></select><button id="tour">Start tour</button><button id="reset">Reset camera</button></div></header><section id="info" class="panel" aria-live="polite"><strong id="heading"></strong><p id="description"></p><button id="action" class="active"></button><div id="feedback" class="muted" style="margin-top:8px"></div></section><div id="metrics" class="panel" aria-live="off">Initializing…</div><div id="fallback"><h2>3D unavailable</h2><p>This experience needs WebGL and a connection to load Three.js.</p><button onclick="location.reload()">Retry</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/controls/OrbitControls.js';
const $=id=>document.getElementById(id), modes={
sports:{title:'Sports · The Film Room',description:'Explore a basketball court from broadcast and coaching angles. Activate the play to reveal player movement.',action:'Run play',color:0x256b9b},
education:{title:'Education · The Learning Lab',description:'Explore a coding campus. Activate the lesson to reveal a dependency path from fundamentals to a finished project.',action:'Show learning path',color:0x4c6e9a},
gifts:{title:'Gifts · The Moment',description:'Open an interactive gift. The reveal is local to this browser; no recipient information is collected.',action:'Open gift',color:0x8654a6},
commercial:{title:'Commercial · The District',description:'Tour a conceptual Mediterranean district. This is a demonstration, not a real property or an architectural plan.',action:'Reveal amenities',color:0x9a7858}};
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0e1929);const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;$('viewport').appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=8;controls.maxDistance=140;controls.maxPolarAngle=Math.PI*.49;scene.add(new THREE.HemisphereLight(0xffffff,0x41516b,2.2));const light=new THREE.DirectionalLight(0xffe5c3,2.6);light.position.set(-30,70,35);light.castShadow=true;scene.add(light);
let group=new THREE.Group();scene.add(group);let mode='sports',active=false,tour=false,tourStart=0,animationObjects=[];const clock=new THREE.Clock();
function material(color,metalness=0){return new THREE.MeshStandardMaterial({color,roughness:.68,metalness})}
function box(w,h,d,x,y,z,color,parent=group){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh}
function sphere(r,x,y,z,color,parent=group){const mesh=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),material(color));mesh.position.set(x,y,z);parent.add(mesh);return mesh}
function cylinder(r,h,x,y,z,color,parent=group){const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),material(color));mesh.position.set(x,y,z);parent.add(mesh);return mesh}
function line(points,color){const geo=new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(...p)));group.add(new THREE.Line(geo,new THREE.LineBasicMaterial({color})))}
function clear(){scene.remove(group);group.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){const m=Array.isArray(o.material)?o.material:[o.material];m.forEach(x=>x.dispose())}});group=new THREE.Group();scene.add(group);animationObjects=[];active=false;camera.position.set(36,35,43);controls.target.set(0,0,0);$('feedback').textContent='';$('action').textContent=modes[mode].action}
function sports(){box(48,.5,28,0,0,0,0xb68b57);for(const x of [-22,22]){box(.25,7,.25,x,3.5,0,0xdddddd);box(.2,4,6,x,7,0,0xe4f7ff);const rim=cylinder(.9,.12,x+(x<0?2:-2),5.8,0,0xee672d);rim.rotation.z=Math.PI/2}line([[-24,.28,0],[24,.28,0]],0xffffff);for(let i=0;i<12;i++){const a=i/12*Math.PI*2;line([[Math.cos(a)*5,.3,Math.sin(a)*5],[Math.cos((i+1)/12*Math.PI*2)*5,.3,Math.sin((i+1)/12*Math.PI*2)*5]],0xffffff)}for(let i=0;i<10;i++){const x=(i<5?-13:13)+(i%5)*2,z=(i%5-2)*4;const player=sphere(.85,x,1.8,z,i<5?0x6cd4ff:0xffa16b);cylinder(.65,2,x,.8,z,i<5?0x1c70aa:0xd26337);animationObjects.push({mesh:player,x,z,index:i})}}
function education(){box(55,.6,40,0,0,0,0x375f54);for(let i=0;i<5;i++){const x=-22+i*11;box(8,6+i,10,x,3+i/2,0,[0xe7e0cc,0xa6c8c9,0xe3b98c,0xb0a5d2,0xf0d4b0][i]);box(7,.3,11,x,6.2+i,0,0x384b60);sphere(1.2,x,8+i,0,0xffd276);if(i)line([[-22+(i-1)*11,9+(i-1),0],[x,9+i,0]],0x91ffe0)}for(let i=0;i<12;i++)cylinder(.5,2,-27+i*5,1,16,0x67b58c)}
function gifts(){box(55,.5,40,0,0,0,0x352c53);for(let i=0;i<30;i++){const a=i*2.4,r=8+i*.5;sphere(.2,Math.cos(a)*r,2+i*.12,Math.sin(a)*r,0xf9d99c)}const present=box(11,9,11,0,5,0,0xaa5ed0);box(2,9.3,11.3,0,5,0,0xffd9a6);box(11.3,9.3,2,0,5,0,0xffd9a6);const lid=box(12,2,12,0,10.5,0,0xdda3ed);animationObjects.push({mesh:lid,type:'lid'});}
function commercial(){box(65,.4,65,0,0,0,0xb6c69a);for(const v of [-18,18]){box(65,.2,7,0,.2,v,0x495866);box(7,.2,65,v,.2,0,0x495866)}for(let i=0;i<12;i++){const x=-27+(i%4)*18,z=-27+Math.floor(i/4)*25;if(Math.abs(x)<13&&Math.abs(z)<13)continue;const h=6+i%4*2;box(12,h,12,x,h/2,z,0xf0e7d8);box(13,.5,13,x,h+.3,z,0xb86f52);for(let k=-1;k<=1;k++)box(1.3,2,.15,x+k*3,3,z+6.1,0x6b9da7)}cylinder(7,1,0,.8,0,0xe8d5b8);cylinder(5.5,.2,0,1.4,0,0x50c4d6);cylinder(1,5,0,4,0,0xf5e4ce);for(let i=0;i<12;i++){const a=i/12*Math.PI*2;cylinder(.6,4,Math.cos(a)*29,2,Math.sin(a)*29,0x8c6954);sphere(2.5,Math.cos(a)*29,5,Math.sin(a)*29,0x438b66)}}
function load(next){mode=next;clear();scene.background=new THREE.Color(modes[mode].color);({sports,education,gifts,commercial})[mode]();$('heading').textContent=modes[mode].title;$('description').textContent=modes[mode].description;$('mode').value=mode;history.replaceState(null,'','#'+mode)}
$('mode').onchange=e=>load(e.target.value);$('reset').onclick=()=>{tour=false;$('tour').textContent='Start tour';camera.position.set(36,35,43);controls.target.set(0,0,0)};$('tour').onclick=()=>{tour=!tour;tourStart=clock.elapsedTime;$('tour').textContent=tour?'Stop tour':'Start tour'};
$('action').onclick=()=>{active=!active;$('action').textContent=active?'Reset interaction':modes[mode].action;$('feedback').textContent=active?({sports:'Play visualization running',education:'Five learning stages connected',gifts:'Gift opened — a moment of joy',commercial:'Amenities: plaza, fountain, residences, streets and greenery'})[mode]:'Interaction reset'};
let frames=0,last=0;function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;frames++;if(t-last>1){$('metrics').textContent='FPS ~'+Math.round(frames/(t-last))+' · '+renderer.info.render.calls+' draw calls';last=t;frames=0}if(tour){const a=(t-tourStart)/18*Math.PI*2;camera.position.set(Math.cos(a)*47,25+7*Math.sin(a*.5),Math.sin(a)*47);controls.target.set(0,0,0)}if(mode==='sports')animationObjects.forEach(o=>{o.mesh.position.x=o.x+(active?Math.sin(t*1.2+o.index)*3:0);o.mesh.position.z=o.z+(active?Math.cos(t+o.index)*2:0)});if(mode==='gifts')animationObjects.forEach(o=>{o.mesh.position.y=10.5+(active?4:0);o.mesh.rotation.z=active?-.2:0});controls.update();renderer.render(scene,camera)}try{load(modes[location.hash.slice(1)]?location.hash.slice(1):'sports');animate()}catch(e){console.error(e);document.body.classList.add('error')}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
