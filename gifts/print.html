#172b43;color:white}.quests{display:grid;grid-template-columns:1fr 1fr;gap:14px}.quest{background:white;border:2px solid #263a55;border-radius:18px;padding:23px;min-height:370px;break-inside:avoid;display:flex;flex-direction:column}.quest h2{margin:8px 0;font-size:27px;line-height:1.1;letter-spacing:-.04em}.number{color:#684fc2;font-weight:900;font-size:12px;letter-spacing:.16em}.prompt{font-size:17px}.hint{background:#f4efff;border-left:4px solid #7753c6;margin-top:auto;padding:12px;font-size:13px}.space{height:105px;margin-top:16px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#bbc8d2 32px)}.end{margin:24px 0;padding:27px;border:2px dashed #66758e;border-radius:18px;background:white}.end h2{margin:0 0 8px}.end p{max-width:850px}.safety{font-size:13px;color:#4e5c70}.foot{padding:18px 0 30px;color:#657282;font-size:12px}@media(max-width:700px){.cover{padding:24px}.quests,.gift{grid-template-columns:1fr}.cover:after{right:-50px}.quest{min-height:300px}}@page{size:letter;margin:0.55in}@media print{body{background:white;color:black;font-size:11pt}.shell{max-width:none;padding:0}.toolbar,.picker,.no-print{display:none!important}.cover{box-shadow:none;border:2px solid black;break-after:page;border-radius:0;min-height:8.5in;display:flex;flex-direction:column;justify-content:center}.cover:after{color:#eee}.cover h1{font-size:64pt}.gift input{border:0;border-bottom:1px solid black;border-radius:0;background:transparent;padding:5px}.help{border-radius:0;break-after:page}.quests{display:block}.quest{border-radius:0;min-height:8.7in;margin:0 0 0.4in;break-after:page;border:2px solid black;padding:0.3in}.quest h2{font-size:32pt}.quest .prompt{font-size:17pt}.quest .hint{font-size:13pt;margin-top:18px}.space{flex:1;min-height:3in}.end{break-before:page;border-radius:0;margin:0;padding:25px}.foot{display:none}}

'use strict';
const catalog={"game":{"title":"Game Inventor Quest Deck","tag":"LEVEL UP YOUR IDEAS","age":"Ages 8–13","intro":"An original, screen-free game-design workbook. Sketch, balance, test and invent your own playable rules.","instructions":"Allow 15–25 minutes per quest. No software or existing game account is needed. Let the child invent first, then ask them to explain a rule and test it.","quests":[["Design a Hero","Invent a hero with one strength, one weakness and a special move. Draw them and give the move a cooldown.","A great hero has tradeoffs; explain when the move can and cannot be used."],["Build the First Level","Draw a map with START, FINISH, three obstacles and one secret. Add a rule for each obstacle.","Try following your own route with a finger. Is the finish reachable?"],["Coins or Courage?","Create a scoring system with three ways to gain points and one way to lose points.","Check whether a player can exploit the scoring rule by repeating an easy action."],["The Tiny Bug Hunt","A jump button should work once, but it sometimes jumps twice. Sketch three possible causes and one experiment.","Separate the cause you suspect from the test that could prove it."],["Enemy With a Pattern","Invent an enemy with a three-step movement pattern and draw its repeated cycle.","Use arrows to show the loop and mark when the player has a safe opening."],["The Choice Door","Make a choice with two different paths. Each has a benefit and a cost. Draw the decision tree.","There should be a meaningful reason to choose either branch."],["Playtest Lab","Ask someone to try your rules for two minutes. Record one confusion and one surprising strategy.","Change one rule only, play again, and decide whether the experience improved."],["Pitch Your Game","Name your game. Describe its goal, controls, unique twist, and who might enjoy it. Make cover art.","Give a 30-second pitch; show one thing a player actually does."]],"answers":"Creative quests have no single answer. Check for a written rule, a test of that rule, and one improvement. The ‘Bug Hunt’ calls for a hypothesis and an experiment, not a guessed correct cause.","bonus":"Bonus: combine three quest cards into a paper prototype with numbered squares, a pencil, and a die."},"birthday":{"title":"Birthday Game Party Kit","tag":"UNWRAP A MINI ADVENTURE","age":"Ages 7–12","intro":"A low-prep party with eight original creative stations, a host plan and printable achievement tickets.","instructions":"Recommended 60–90-minute party: 10-minute welcome, four 10-minute stations, 10-minute break, 15-minute team final, 10-minute awards. Pick 4–6 stations, not necessarily all eight. An adult supervises any physical activity.","quests":[["Make a Team Name","Choose a team name, draw a flag and invent a three-word cheer.","Each person adds one idea, then the team agrees on a final flag."],["Secret Symbol Relay","Invent five picture symbols and their meanings. Exchange with another group to decode.","Keep the original key separate until both teams try decoding."],["Build a Paper Tower","Use ten sheets of scrap paper and no tape. Make a freestanding tower that survives a five-second count.","Change one fold or support idea between attempts."],["Mystery Map","Draw a 4×4 grid. Hide a paper treasure on one square. Write three clues so a teammate can locate it.","Make the clues sufficient to narrow the map to one square."],["Create-a-Creature","Draw a funny creature made of three animal features. Give it a birthday superpower.","Trade drawings and tell a 20-second story."],["Design a Party Mini-Game","Invent a cooperative game with a clear win condition and a 60-second time limit.","Run one playtest. Rewrite the instructions if anyone was confused."],["Puzzle Ticket Exchange","Everyone writes a riddle with one unambiguous answer. Swap tickets and solve.","If no one can answer, improve the riddle rather than revealing it immediately."],["Grand Finale: Boss Battle","The whole group invents a paper boss with three challenges. Everyone must contribute a different skill to win.","Choose teamwork and explanations, not physical strength, as the way to advance."]],"answers":"Host notes: Provide paper, pencils, crayons and optional reusable cups. Avoid small parts for younger children. Every station can have multiple correct outcomes; award tickets for creativity, kindness, testing and teamwork, never rank children publicly.","bonus":"Bonus: print extra pages as party invitations, achievement tickets and thank-you notes. No costumes or electronics needed."},"space":{"title":"Space Explorer STEM Missions","tag":"MISSION CONTROL / KIDS EDITION","age":"Ages 8–13","intro":"Eight paper-based science, engineering and mathematical missions inspired by imaginary space exploration.","instructions":"Allow 15–30 minutes per mission. Uses pencils, paper, a ruler and optional household items. Adult support recommended for measurements and experiments. No launch hardware, chemicals or heat required.","quests":[["Build a Mission Patch","Create a mission name, logo, motto and three rules for keeping the crew safe.","Explain why your first rule matters more than decoration."],["Rover Route","On a 6×6 grid, plan a route from (1,1) to (6,6) while avoiding three imaginary craters.","Count each move. Can you find a shorter safe route?"],["Moon Base Budget","You have 20 supply points. Food costs 6, water 5, shelter 8, science tools 4 and games 2. Pick supplies without exceeding 20.","Explain why you chose essentials and what you left behind."],["Signals From Orbit","Invent a binary code using ▲ for 1 and ● for 0. Encode the numbers 1, 2, 3 and 4 with three symbols each.","Test whether another explorer can decode the signal using your key."],["Rocket Without Rockets","Draw a paper craft with a capsule, fuel tank and fins. Label which parts are imaginary and which real rockets need.","Explain what a real spacecraft needs to steer, land or return."],["The Alien Weather Report","Create a fictional planet with two weather patterns and one problem those patterns cause for explorers.","Label fictional facts clearly. How would a scientist test a guess?"],["Balance a Habitat","Your habitat has 12 energy units. Lights take 2, air 5, heating 3, research 4. Make a safe daily plan.","What can be turned off? What must always remain on?"],["Mission Debrief","Write a two-minute crew log: what worked, what failed, what changed and what the next crew should try.","Use evidence from one of your earlier worksheets."]],"answers":"Checkable examples: The supply list food + water + shelter costs 19 points. In habitat planning, air + heating + lights costs 10, leaving 2, so research at 4 cannot run simultaneously. Binary 1–4 can be 001, 010, 011, 100 when ▲=1 and ●=0.","bonus":"Bonus: invite a family member to be Mission Control and ask one question after each debrief."},"family":{"title":"Family Logic Game Night","tag":"PUZZLES FOR ALL GENERATIONS","age":"Ages 7+ with adult teammates","intro":"Ten original collaborative puzzles, a score-free game-night format, hints and a complete answer guide.","instructions":"Split into teams of two or solve together. Give each round 5–8 minutes. Encourage people to explain their thinking. Nobody gets eliminated. Use the hint on each card if needed.","quests":[["Number Trail","Continue the pattern: 3, 6, 10, 15, 21, __, __. Explain the pattern.","Look at how much the numbers increase each time."],["The Library Line","Ada is ahead of Ben. Ben is ahead of Cy. Cy is ahead of Dee. Who is second from the front?","Draw four empty places in a row."],["Marble Mystery","One bag has 4 red, 3 blue, and 2 green marbles. Without looking, how many picks guarantee two of the same color?","Imagine drawing a different color each time first."],["Robot Instructions","A robot starts facing north. It turns right, walks two steps, turns left, walks one step. What direction is it facing?","Only turns change direction; steps do not."],["Secret Alphabet","If CAT becomes DBU by shifting each letter one forward, what does MOON become?","Apply the same rule to each letter."],["The Three Switches","A lamp is ON if exactly one of switches A and B is ON. What happens if both are ON?","Try a truth table for 00, 01, 10, 11."],["Calendar Countdown","A movie starts on Thursday. Three days later a party begins. What day is the party?","Count Friday as day one."],["Shape Builder","Draw a square using four straight lines. Add just one straight line to split it into exactly two regions.","A diagonal is enough. Try more than one valid line."],["The Bridge Plan","A family needs to carry 7 books. Each trip can carry at most 3 books. What is the fewest number of trips carrying books?","Divide, then round up when a remainder exists."],["Your Puzzle Studio","Make a new riddle using a pattern, rule or diagram. Write an answer and a hint without revealing it.","Have another player test whether your question has only one answer."]],"answers":"Answer key: 1) 28, 36 (differences 3,4,5,6,7,8). 2) Ben. 3) Four picks. 4) North. 5) NPPO. 6) OFF. 7) Sunday. 8) Draw a diagonal. 9) Three trips. 10) Open-ended; check the clue has a unique answer.","bonus":"Bonus: Give everyone a ‘Curious Thinker’ certificate for sharing a strategy, changing their mind or asking a good question."}};
Object.assign(catalog,window.APERTURE_GIFT_LAB_V2?.kits||{});
const params=new URLSearchParams(location.search);
const groups={bundle:['game','birthday','space','family'],...(window.APERTURE_GIFT_LAB_V2?.bundles||{})};
const selected=params.get('kit')||'game';
const permitted=[...Object.keys(catalog),...Object.keys(groups)];
const initial=permitted.includes(selected)?selected:'game';
function clean(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
let active=groups[initial]?.[0]||initial;
function render(){
const k=catalog[active]; const isBundle=Array.isArray(groups[initial]);
const chooser=isBundle?'<div class="bundle-note no-print"><strong>Included in your collection:</strong> '+groups[initial].length+' printable books. Choose one below, then Print / Save PDF. Repeat for the other books. Each book prints separately.</div><div class="picker no-print" role="group" aria-label="Choose a gift workbook">'+groups[initial].map(id=>'<button type="button" data-kit="'+id+'" aria-pressed="'+(active===id)+'">'+clean(catalog[id].title)+'</button>').join('')+'</div>':'';
const cards=k.quests.map((item,i)=>'<article class="quest '+(k.kind==='awards'?'award':'')+'"><div class="number">'+(k.kind==='awards'?'AWARD':'ACTIVITY')+' '+String(i+1).padStart(2,'0')+' / '+String(k.quests.length).padStart(2,'0')+'</div><h2>'+clean(item[0])+'</h2>'+(k.kind==='awards'?'<div class="award-name">THIS AWARD CELEBRATES<br><br>________________________________<br><small>Recipient name</small></div>':'')+'<p class="prompt">'+clean(item[1])+'</p><div class="space" aria-hidden="true"></div><div class="hint"><strong>FACILITATOR TIP:</strong> '+clean(item[2])+'</div>'+(k.kind==='awards'?'<p>Presented on: __________________ &nbsp; Signed by: __________________</p>':'')+'</article>').join('');
document.getElementById('app').innerHTML=chooser+'<section class="cover"><div class="eyebrow">'+clean(k.tag)+'</div><h1>'+clean(k.title)+'</h1><p class="subtitle">'+clean(k.intro)+'</p><strong>'+clean(k.age)+' · '+k.quests.length+' ready-to-print activities · Original APERTURE activity book</strong><div class="gift"><label>To: <input id="recipient" maxlength="80" placeholder="A future creator"></label><label>From: <input id="sender" maxlength="80" placeholder="Someone who believes in you"></label></div><p class="safety">Write a dedication, then print or save this workbook as a PDF. Names stay in this browser; they are not uploaded.</p></section><section class="help"><div class="eyebrow">HOW TO USE</div><h2>How to play</h2><p>'+clean(k.instructions)+'</p><p><strong>Suggested setup:</strong> pencils, blank paper and optional coloring supplies. Activities are original educational or self-reflection prompts, not clinical care, live instruction or a physical product.</p></section><section class="quests">'+cards+'</section><section class="end"><div class="eyebrow">REFLECT &amp; CELEBRATE</div><h2>Mission complete!</h2><p>'+clean(k.bonus)+'</p><p><strong>Answer &amp; facilitator notes:</strong> '+clean(k.answers)+'</p><div class="space"></div><h3>Certificate of learning</h3><p>This certificate celebrates __________________________ for effort, curiosity, reflection and progress.</p><p>Signed: _____________________ &nbsp; Date: _____________________</p></section>';
document.querySelectorAll('[data-kit]').forEach(b=>b.addEventListener('click',()=>{active=b.getAttribute('data-kit');render();window.scrollTo({top:0,behavior:'smooth'})}));
}
document.getElementById('print').addEventListener('click',()=>window.print());
render();
</script></body></html>
