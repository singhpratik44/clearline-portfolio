<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030714"><meta name="description" content="APERTURE 2040: explore a living universe of Awareness, Joy, Love and Wonder."><title>APERTURE 2040 · Living Universe</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030714;color:#edf8ff}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #a2f6ff;outline-offset:4px}#space{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 18%,rgba(0,2,14,.35) 100%)}.shell{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}.shell>*{pointer-events:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;letter-spacing:.22em;font-size:12px;font-weight:800}.sigil{width:37px;height:37px;border:1px solid #8feaff;border-radius:50%;display:grid;place-items:center;font-size:26px;box-shadow:0 0 25px #49dfff55}.actions{display:flex;gap:7px}.pill{background:#0a1d32bb;border:1px solid #7bc8ef55;color:#e9faff;border-radius:100px;padding:10px 13px;min-height:42px;backdrop-filter:blur(16px);font-size:12px}.pill[aria-pressed=true]{border-color:#9ff4ff;background:#1d5067dd}.hero{margin-top:clamp(22px,5vh,60px);pointer-events:none}.eyebrow{color:#91e8ff;letter-spacing:.24em;font-size:10px;font-weight:700}.hero h1{font-size:clamp(37px,8vw,76px);line-height:.98;letter-spacing:-.075em;margin:13px 0 12px;font-weight:600;max-width:650px}.hero h1 em{font-style:normal;background:linear-gradient(100deg,#80e9ff,#b9aaff,#ffb6d3);color:transparent;background-clip:text}.hero p{font-size:13px;line-height:1.6;color:#a5bfd1;max-width:370px;margin:0}.bottom{margin-top:auto;display:flex;align-items:end;justify-content:space-between;gap:15px}.dock{display:flex;gap:8px;padding:8px;border:1px solid #80cde344;background:#08192dbe;border-radius:24px;backdrop-filter:blur(22px);box-shadow:0 20px 60px #0008}.nodebtn{border:0;background:transparent;color:#b6c9dd;display:flex;align-items:center;flex-direction:column;gap:6px;min-width:73px;padding:8px 6px;border-radius:17px;font-size:11px}.nodebtn b{font-size:24px;font-weight:400}.nodebtn[aria-pressed=true]{background:#244966;color:white;box-shadow:inset 0 0 0 1px #95eaff77}.help{font-size:11px;color:#94aec3;text-align:right;max-width:180px}.panel{position:fixed;z-index:5;left:50%;bottom:calc(114px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(440px,calc(100% - 32px));border:1px solid #92d8ff77;border-radius:27px;padding:22px;background:linear-gradient(145deg,#142c48f2,#07152df2);box-shadow:0 25px 100px #000b,0 0 65px var(--glow,#60dfff22);backdrop-filter:blur(25px)}.panel[hidden]{display:none}.panel-head{display:flex;justify-content:space-between;align-items:center}.panel-kicker{font-size:10px;letter-spacing:.2em;color:var(--accent,#92eaff);font-weight:700}.close{border:1px solid #c2e8ff55;background:#ffffff12;color:white;border-radius:50%;width:36px;height:36px}.panel h2{font-size:clamp(28px,6vw,38px);letter-spacing:-.05em;margin:12px 0}.panel p{color:#c4d7e8;line-height:1.6;font-size:14px}.panel .prompt{font-size:18px;color:#f4faff}.panel-foot{display:flex;gap:8px;align-items:center;margin-top:20px}.primary{background:linear-gradient(100deg,#9df0ff,#b5c4ff);color:#061626;border:0;border-radius:99px;padding:13px 17px;font-weight:750;flex:1;text-decoration:none;text-align:center;font-size:13px}.small{font-size:11px;color:#8fb5ce}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:650px){.hero{margin-top:24px}.hero h1{font-size:clamp(40px,11vw,62px)}.hero p{max-width:280px;font-size:12px}.help{display:none}.dock{width:100%;justify-content:space-around;padding:7px}.nodebtn{min-width:0;flex:1;font-size:10px}.nodebtn b{font-size:22px}.panel{bottom:calc(103px + env(safe-area-inset-bottom))}.brand{font-size:10px}.pill{padding:9px 10px}.shell{padding-left:13px;padding-right:13px}.top .actions{gap:5px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head>
<body><canvas id="space" aria-label="Interactive 3D universe with four orbiting experience worlds; use the four buttons below to explore without using the canvas."></canvas>
<div class="shell"><header class="top"><div class="brand"><span class="sigil" aria-hidden="true">◈</span><span>APERTURE <span style="color:#8eeaff">2040</span></span></div><div class="actions"><button class="pill" id="motion" aria-pressed="false">Pause motion</button><button class="pill" id="quiet" aria-pressed="false">Quiet</button></div></header>
<section class="hero"><div class="eyebrow">THE LIVING UNIVERSE · 01 / ∞</div><h1>Enter the <em>moment.</em></h1><p>Four worlds. Infinite ways to feel alive. Touch a world, drag to explore, or choose a path below.</p></section>
<footer class="bottom"><nav class="dock" aria-label="Choose an experience"><button class="nodebtn" data-world="0" aria-pressed="false"><b>◉</b>Awareness</button><button class="nodebtn" data-world="1" aria-pressed="false"><b>✳</b>Joy</button><button class="nodebtn" data-world="2" aria-pressed="false"><b>♡</b>Love</button><button class="nodebtn" data-world="3" aria-pressed="false"><b>✧</b>Wonder</button></nav><div class="help">Drag to orbit · Tap a world<br>Private by design · No sign-in</div></footer></div>
<aside class="panel" id="panel" hidden role="dialog" aria-modal="false" aria-labelledby="worldtitle"><div class="panel-head"><span class="panel-kicker" id="worldkicker">WORLD 01</span><button class="close" id="close" aria-label="Close world">×</button></div><h2 id="worldtitle"></h2><p id="worlddesc"></p><p class="prompt" id="worldprompt"></p><div class="panel-foot"><a id="begin" class="primary" href="./guided.html">Enter guided journey ↗</a><span class="small">4 gentle steps</span></div></aside>
<div class="visually-hidden" id="announce" aria-live="polite"></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('space'),ctx=canvas.getContext('2d',{alpha:false});if(!ctx){document.getElementById('announce').textContent='Canvas unavailable. Choose an experience using the buttons.';return;}
const worlds=[{name:'Awareness',symbol:'◉',color:'#a9a4ff',desc:'A world of presence. Notice what is here without needing to change it.',prompt:'What do you notice right now?',id:'awareness'},{name:'Joy',symbol:'✳',color:'#ffc89b',desc:'A world of delight. Discover a small light in the ordinary.',prompt:'What is one good thing in this moment?',id:'joy'},{name:'Love',symbol:'♡',color:'#ff98c6',desc:'A world of care. Make room for kindness and connection.',prompt:'Where could care begin today?',id:'love'},{name:'Wonder',symbol:'✧',color:'#8dffe0',desc:'A world of possibility. Follow a question into the unknown.',prompt:'What makes you curious?',id:'wonder'}];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let W=0,H=0,dpr=1,rot=.3,tilt=.18,auto=!reduce,quiet=false,selected=-1,drag=null,stars=[],last=0,raf=0;const PI=Math.PI;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(210,Math.floor(W*H/3300))},(_,i)=>{const a=Math.sin(i*127.1)*43758.5453,b=Math.sin(i*31.7)*12345.67;return{x:(a-Math.floor(a))*W,y:(b-Math.floor(b))*H,r:.35+(i%4)*.22}});}
function xyz(i){const a=i*PI/2+rot;const radius=Math.min(W*.33,H*.32,285);const x=Math.cos(a)*radius,z=Math.sin(a)*radius;const yy=Math.sin(i*2.3+tilt)*radius*.35;const perspective=1+z/900;return{x:W/2+x*perspective,y:H*(W<650?.54:.57)+yy*perspective,z,r:(W<650?32:49)*perspective,scale:perspective};}
function ring(cx,cy,rx,ry,alpha){ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,tilt*.5,0,PI*2);ctx.strokeStyle='rgba(99,190,255,'+alpha+')';ctx.lineWidth=1;ctx.stroke();}
function draw(time){const dt=Math.min((time-last)||16,40);last=time;if(auto&&!quiet)rot+=dt*.000085;ctx.fillStyle='#030714';ctx.fillRect(0,0,W,H);
const bg=ctx.createRadialGradient(W*.5,H*.55,0,W*.5,H*.55,Math.max(W,H)*.7);bg.addColorStop(0,'#0c2a46');bg.addColorStop(.55,'#071427');bg.addColorStop(1,'#030714');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
if(!quiet){for(const s of stars){ctx.fillStyle='rgba(188,224,255,.48)';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,PI*2);ctx.fill();}}
const centerY=H*(W<650?.54:.57),radius=Math.min(W*.33,H*.32,285);ring(W/2,centerY,radius*1.6,radius*.65,.16);ring(W/2,centerY,radius*1.16,radius*.49,.24);ring(W/2,centerY,radius*.6,radius*.26,.16);
const nodes=worlds.map((_,i)=>({...xyz(i),i})).sort((a,b)=>a.z-b.z);
for(const n of nodes){const w=worlds[n.i],r=n.r,glow=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r*2.7);glow.addColorStop(0,w.color+'77');glow.addColorStop(.4,w.color+'20');glow.addColorStop(1,'#00000000');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(n.x,n.y,r*2.7,0,PI*2);ctx.fill();
const sphere=ctx.createRadialGradient(n.x-r*.28,n.y-r*.35,r*.08,n.x,n.y,r);sphere.addColorStop(0,'#f4fbff');sphere.addColorStop(.13,w.color);sphere.addColorStop(.62,w.color+'b8');sphere.addColorStop(1,'#101d43');ctx.fillStyle=sphere;ctx.beginPath();ctx.arc(n.x,n.y,r,0,PI*2);ctx.fill();ctx.strokeStyle=selected===n.i?'#ffffff':'#d9faff88';ctx.lineWidth=selected===n.i?2.5:1;ctx.stroke();
ctx.fillStyle='#06142a';ctx.font='500 '+Math.round(r*.83)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(w.symbol,n.x,n.y+2);ctx.fillStyle='#eaf8ff';ctx.font='600 '+(W<650?11:13)+'px system-ui';ctx.fillText(w.name,n.x,n.y+r+20);}
const core=ctx.createRadialGradient(W/2-15,centerY-20,1,W/2,centerY,Math.min(W*.17,100));core.addColorStop(0,'#e6fbff');core.addColorStop(.1,'#8feaff');core.addColorStop(.45,'#318ac3');core.addColorStop(1,'#10315a00');ctx.fillStyle=core;ctx.beginPath();ctx.arc(W/2,centerY,Math.min(W*.17,100),0,PI*2);ctx.fill();ctx.strokeStyle='#b9f7ff88';ctx.lineWidth=1;ctx.beginPath();ctx.arc(W/2,centerY,Math.min(W*.1,56),0,PI*2);ctx.stroke();
if(!quiet)raf=requestAnimationFrame(draw);}
function redraw(){if(raf)cancelAnimationFrame(raf);last=0;raf=requestAnimationFrame(draw);}
function openWorld(i){selected=i;const w=worlds[i];document.getElementById('worldtitle').textContent=w.name;document.getElementById('worlddesc').textContent=w.desc;document.getElementById('worldprompt').textContent=w.prompt;document.getElementById('worldkicker').textContent='WORLD 0'+(i+1)+' · '+w.name.toUpperCase();document.getElementById('begin').href='./guided.html?experience='+encodeURIComponent(w.id);const panel=document.getElementById('panel');panel.style.setProperty('--accent',w.color);panel.style.setProperty('--glow',w.color+'30');panel.hidden=false;document.querySelectorAll('[data-world]').forEach((b,j)=>b.setAttribute('aria-pressed',String(j===i)));document.getElementById('announce').textContent=w.name+' world selected';redraw();}
function closeWorld(){selected=-1;document.getElementById('panel').hidden=true;document.querySelectorAll('[data-world]').forEach(b=>b.setAttribute('aria-pressed','false'));redraw();}
document.querySelectorAll('[data-world]').forEach(b=>b.addEventListener('click',()=>openWorld(Number(b.dataset.world))));document.getElementById('close').addEventListener('click',closeWorld);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeWorld();});
document.getElementById('motion').addEventListener('click',e=>{auto=!auto;e.currentTarget.setAttribute('aria-pressed',String(!auto));e.currentTarget.textContent=auto?'Pause motion':'Resume motion';redraw();});
document.getElementById('quiet').addEventListener('click',e=>{quiet=!quiet;e.currentTarget.setAttribute('aria-pressed',String(quiet));redraw();});
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,rot,tilt,moved:false};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>8)drag.moved=true;if(drag.moved){rot=drag.rot+dx*.008;tilt=Math.max(-.7,Math.min(.7,drag.tilt+dy*.003));redraw();}});
canvas.addEventListener('pointerup',e=>{if(!drag)return;if(!drag.moved){let best=-1,dist=Infinity;worlds.forEach((_,i)=>{const n=xyz(i),d=Math.hypot(e.clientX-n.x,e.clientY-n.y);if(d<n.r+24&&d<dist){best=i;dist=d;}});if(best>=0)openWorld(best);}drag=null;});canvas.addEventListener('pointercancel',()=>{drag=null;});
addEventListener('resize',()=>{resize();redraw();});document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0;}else redraw();});
resize();redraw();const id=new URL(location.href).searchParams.get('experience');const i=worlds.findIndex(w=>w.id===id);if(i>=0)openWorld(i);
})();
</script></body></html>
