<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>APERTURE • Spatial Lab</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#080c15;color:#fff;overflow:hidden}canvas{display:block}header{position:absolute;z-index:5;top:0;left:0;right:0;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#080c15d9,transparent);pointer-events:none}header b{letter-spacing:.2em;font-size:14px}header small{display:block;color:#9da8c4;letter-spacing:.09em;margin-top:5px}button,select,input{font:inherit}button,select{background:#182237e8;color:white;border:1px solid #455572;border-radius:13px;padding:12px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #8ccaff}button.active{background:#336fbe;border-color:#9bcfff}header button{pointer-events:auto}.panel{position:absolute;z-index:4;left:14px;bottom:calc(18px + env(safe-area-inset-bottom));right:14px;max-width:680px;background:#0c1525e8;border:1px solid #394761;border-radius:22px;padding:14px;backdrop-filter:blur(14px)}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button{flex:1;min-width:85px}.settings{display:flex;align-items:center;gap:12px;margin-top:12px}.settings label{font-size:12px;color:#b5c4df}.settings input{flex:1;min-width:40px}#status{font-size:12px;color:#b7c5df;margin:10px 2px 0}#move{position:absolute;z-index:3;right:20px;bottom:220px;display:none;grid-template-columns:repeat(3,48px);gap:4px;touch-action:none}#move button{padding:10px;background:#14223ac9}#move .up{grid-column:2}#move .left{grid-column:1}#move .down{grid-column:2}#move .right{grid-column:3}#hint{position:absolute;top:90px;left:18px;background:#101b2cba;padding:10px;border-radius:12px;font-size:12px;color:#c8d7ef;max-width:260px}#room{position:absolute;right:16px;top:90px;padding:10px;background:#101b2cba;border-radius:12px;font-size:12px}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#080c15;z-index:9}#loading.hidden{display:none}@media(max-width:600px){#move{display:grid}.panel{padding:10px;bottom:calc(10px + env(safe-area-inset-bottom))}.controls button{font-size:12px;padding:10px 6px}#hint{font-size:11px;max-width:180px}#room{top:145px}}
</style></head><body><div id="loading">Loading APERTURE 3D…</div><header><div><b>APERTURE ∞</b><small>SPATIAL EXPERIENCE LAB • DEMO</small></div><button id="reset">Reset</button></header><div id="hint">Drag to orbit • pinch to zoom • switch to Walk to explore</div><div id="room" aria-live="polite">Demo residence • 12 × 10 m</div><div id="move" aria-label="Walk controls"><button class="up" data-move="forward" aria-label="Forward">↑</button><button class="left" data-move="left" aria-label="Left">←</button><button class="down" data-move="back" aria-label="Backward">↓</button><button class="right" data-move="right" aria-label="Right">→</button></div><section class="panel"><div class="controls"><button id="doll" class="active">Dollhouse</button><button id="walk">Walk</button><button id="tour">▶ Tour</button><button id="style">Style: Modern</button></div><div class="settings"><label for="light">Time of day</label><input id="light" type="range" min="0" max="100" value="55"><span id="time">Afternoon</span></div><div id="status" aria-live="polite">Concept scene, not an architectural measurement model. No client floor plan has been supplied.</div></section>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.169.0';
import {OrbitControls} from 'https://esm.sh/three@0.169.0/examples/jsm/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#0c1729');
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.08,200);camera.position.set(13,14,17);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,0,0);orbit.enableDamping=true;orbit.maxPolarAngle=Math.PI/2.05;orbit.minDistance=5;orbit.maxDistance=36;orbit.update();
scene.add(new THREE.HemisphereLight(0xbcd8ff,0x253044,1.8));const sun=new THREE.DirectionalLight(0xffe5ba,2.3);sun.position.set(8,14,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;scene.add(sun);
const ambient=new THREE.PointLight(0xffbf77,0,12);ambient.position.set(0,2.6,0);scene.add(ambient);
const house=new THREE.Group();scene.add(house);const furniture=new THREE.Group();house.add(furniture);
function mat(color,rough=.8){return new THREE.MeshStandardMaterial({color,roughness:rough})}
const wallMat=mat('#d8dce1'),floorMat=mat('#ad8868'),trimMat=mat('#495369'),glassMat=new THREE.MeshStandardMaterial({color:'#8bc7e8',transparent:true,opacity:.42,metalness:.25,roughness:.2,side:THREE.DoubleSide});
function block(parent,x,y,z,w,h,d,m){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh}
block(house,0,-.16,0,12,.3,10,floorMat);block(house,0,-.4,0,17,.18,15,mat('#24364a'));
function wall(x,z,w,d){block(house,x,1.45,z,w,2.9,d,wallMat)}
wall(-6,0,.18,10);wall(6,0,.18,10);wall(0,-5,12,.18);wall(-4.5,5,3,.18);wall(4.5,5,3,.18);
wall(0,0,.15,4);wall(0,-3.9,.15,2.1);wall(-3,0,6,.15);wall(4.25,0,3.5,.15);
function windowPane(x,z,w,rot=0){const p=block(house,x,1.65,z,w,1.3,.07,glassMat);p.rotation.y=rot;block(house,x,2.35,z,w,.09,.1,trimMat);block(house,x,.96,z,w,.09,.1,trimMat)}
windowPane(-2.2,-4.88,2.4);windowPane(3,-4.88,2.4);windowPane(-2,4.9,2);windowPane(3.8,4.9,2);
function item(x,z,w,d,h,c){return block(furniture,x,h/2,z,w,h,d,mat(c))}
item(-3,-2.7,3.3,1.1,.6,'#647f8d');item(-3,-1.1,1.6,.9,.32,'#9c704f');item(-4.9,-1,1,.7,.45,'#d0ad72');
item(2.8,-2.3,2.5,1.3,.7,'#c7b49c');item(2.8,-2.3,2.7,1.4,.15,'#e7ded0');item(1.2,-4,1,.7,.65,'#66758a');
item(-3.3,2.7,2.8,1.4,.75,'#af8968');for(const x of [-4.5,-2.1])for(const z of [1.6,3.8])item(x,z,.6,.65,.7,'#667487');
item(3.4,2.5,3.2,.75,.88,'#7c8c90');item(5.25,3.3,.9,1,.9,'#53616d');item(1.5,3.8,1,.8,.8,'#6e8994');
const plant=mat('#50896c');for(const [x,z] of [[-5.2,3.8],[5.1,-3.8]]){item(x,z,.65,.65,.6,'#9d826b');block(furniture,x,1.05,z,.7,.9,.7,plant)}
const styles=[['Modern','#647f8d','#ad8868'],['Scandinavian','#d5bca1','#d6bb91'],['Warm luxury','#a87860','#704b38']];let styleIndex=0,mode='doll',tour=false,tourStart=0;const buttons={doll:document.querySelector('#doll'),walk:document.querySelector('#walk'),tour:document.querySelector('#tour')};
function setMode(m){mode=m;buttons.doll.classList.toggle('active',m==='doll');buttons.walk.classList.toggle('active',m==='walk');orbit.enabled=m==='doll';document.querySelector('#move').style.opacity=m==='walk'?'1':'.35';if(m==='walk'){camera.position.set(0,1.65,3.8);camera.rotation.set(0,Math.PI,0)}else{camera.position.set(13,14,17);orbit.target.set(0,0,0);orbit.update()}}
buttons.doll.onclick=()=>{tour=false;setMode('doll')};buttons.walk.onclick=()=>{tour=false;setMode('walk')};
document.querySelector('#reset').onclick=()=>{tour=false;setMode('doll')};
document.querySelector('#style').onclick=()=>{styleIndex=(styleIndex+1)%3;const s=styles[styleIndex];furniture.children[0].material=mat(s[1]);house.children[0].material=mat(s[2]);document.querySelector('#style').textContent='Style: '+s[0]};
document.querySelector('#light').oninput=e=>{const v=Number(e.target.value);const night=v>75;sun.intensity=night?.12:Math.max(.25,2.5-Math.abs(v-45)*.027);sun.color.set(v>50?'#ffb77b':'#fff0d8');sun.position.set(Math.cos(v/100*Math.PI)*12,Math.max(1,Math.sin(v/100*Math.PI)*15),7);ambient.intensity=night?2.5:0;scene.background.set(night?'#090e1d':v>55?'#493e55':'#0c1729');document.querySelector('#time').textContent=night?'Night':v>55?'Sunset':'Day'};
const route=[[-4.2,3.9],[-3,1.3],[-3,-2],[2,-2],[3.5,2.8],[0,3.8]];buttons.tour.onclick=()=>{tour=!tour;if(tour){setMode('walk');tourStart=performance.now();buttons.tour.textContent='■ Stop tour';document.querySelector('#status').textContent='Guided concept tour in progress';}else{buttons.tour.textContent='▶ Tour';document.querySelector('#status').textContent='Tour stopped'}};
let down=false,px=0;renderer.domElement.addEventListener('pointerdown',e=>{if(mode==='walk'){down=true;px=e.clientX}});window.addEventListener('pointerup',()=>down=false);window.addEventListener('pointermove',e=>{if(down&&mode==='walk'&&!tour){camera.rotation.y-=(e.clientX-px)*.006;px=e.clientX}});
const pressed=new Set();window.addEventListener('keydown',e=>pressed.add(e.key.toLowerCase()));window.addEventListener('keyup',e=>pressed.delete(e.key.toLowerCase()));document.querySelectorAll('[data-move]').forEach(b=>{const k=b.dataset.move;b.addEventListener('pointerdown',e=>{e.preventDefault();pressed.add(k);b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',()=>pressed.delete(k));b.addEventListener('pointercancel',()=>pressed.delete(k))});
let last=performance.now();function tick(now){requestAnimationFrame(tick);const dt=Math.min((now-last)/1000,.05);last=now;if(tour){const progress=(now-tourStart)/4500;const idx=Math.floor(progress);if(idx>=route.length-1){tour=false;buttons.tour.textContent='▶ Tour';setMode('doll');document.querySelector('#status').textContent='Tour complete • Dollhouse overview'}else{const t=progress-idx;const a=route[idx],b=route[idx+1];camera.position.set(THREE.MathUtils.lerp(a[0],b[0],t),1.65,THREE.MathUtils.lerp(a[1],b[1],t));camera.lookAt(b[0],1.6,b[1]);}}else if(mode==='walk'){const speed=2.6*dt;const yaw=camera.rotation.y;const f=(pressed.has('w')||pressed.has('forward')?1:0)-(pressed.has('s')||pressed.has('back')?1:0);const r=(pressed.has('d')||pressed.has('right')?1:0)-(pressed.has('a')||pressed.has('left')?1:0);camera.position.x=THREE.MathUtils.clamp(camera.position.x+(-Math.sin(yaw)*f+Math.cos(yaw)*r)*speed,-5.5,5.5);camera.position.z=THREE.MathUtils.clamp(camera.position.z+(-Math.cos(yaw)*f-Math.sin(yaw)*r)*speed,-4.5,4.5)}if(mode==='doll')orbit.update();renderer.render(scene,camera)}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.querySelector('#loading').classList.add('hidden');requestAnimationFrame(tick);
</script></body></html>
