name: APERTURE curriculum checks
on:
  pull_request:
    paths:
      - 'curriculum.html'
      - 'learning-lab.html'
      - 'game-studio.html'
      - 'build-ledger.json'
      - 'tests/test_game_studio.py'
      - 'tests/test_learning_lab.py'
      - 'tests/learning-lab-browser.test.mjs'
      - '.github/workflows/curriculum-checks.yml'
  push:
    branches: [main]
    paths:
      - 'curriculum.html'
      - 'learning-lab.html'
      - 'tests/test_learning_lab.py'
jobs:
  curriculum:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate learning lab
        run: |
          python tests/test_learning_lab.py
          python tests/test_game_studio.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test all lessons in Chromium
        run: node --test tests/learning-lab-browser.test.mjs
