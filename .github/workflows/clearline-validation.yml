name: Clearline deterministic validation
on:
  push:
    paths:
      - 'research/**'
      - 'interactive-decision-universe.html'
      - 'civilization-lab.html'
      - '**/*.html'
      - 'assets/aperture-shell.js'
      - 'tests/site-integrity.test.mjs'
      - 'tests/site-browser.mjs'
      - 'tests/gift-fulfillment.test.mjs'
      - 'gifts/**'
      - 'tests/civilization-browser.mjs'
      - '.github/workflows/clearline-validation.yml'
  pull_request:
    paths:
      - 'research/**'
      - 'interactive-decision-universe.html'
      - 'civilization-lab.html'
      - '**/*.html'
      - 'assets/aperture-shell.js'
      - 'tests/site-integrity.test.mjs'
      - 'tests/site-browser.mjs'
      - 'tests/gift-fulfillment.test.mjs'
      - 'gifts/**'
      - 'tests/civilization-browser.mjs'
      - '.github/workflows/clearline-validation.yml'
jobs:
  representation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deterministic representation invariants
        run: node --test research/representation.test.mjs
      - name: Verify APERTURE research and authorization invariants
        run: node --test research/aperture-intelligence.test.mjs research/ingest-arxiv.test.mjs research/use-cases.test.mjs research/evidence-quality.test.mjs research/decision-report.test.mjs
      - name: Verify paid digital-gift access gates
        run: node --test tests/gift-fulfillment.test.mjs
      - name: Verify touch and keyboard undo support
        run: |
          grep -q "addEventListener('pointerdown',save)" interactive-decision-universe.html
          grep -q "addEventListener('keydown'" interactive-decision-universe.html
      - name: Verify interactive module wiring
        run: |
          grep -q 'type="module"' interactive-decision-universe.html
          grep -q "from './research/representation.mjs'" interactive-decision-universe.html

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser automation
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Test mobile and desktop interactive journeys
        run: |
          node tests/interactive-browser.mjs
          node tests/civilization-browser.mjs
          node tests/site-browser.mjs

  site-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check navigation, routes and homepage scripts
        run: node --test tests/site-integrity.test.mjs
