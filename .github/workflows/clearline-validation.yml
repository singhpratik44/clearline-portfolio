name: Clearline deterministic validation
on:
  push:
    paths:
      - 'research/**'
      - 'coordination/**'
      - 'interactive-decision-universe.html'
      - '.github/workflows/clearline-validation.yml'
  pull_request:
    paths:
      - 'research/**'
      - 'coordination/**'
      - 'interactive-decision-universe.html'
      - '.github/workflows/clearline-validation.yml'
jobs:
  representation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deterministic representation invariants
        run: node --test research/representation.test.mjs coordination/ledger.test.mjs coordination/github-store.test.mjs coordination/router.test.mjs
      - name: Verify touch and keyboard undo support
        run: |
          grep -q "addEventListener('pointerdown',save)" interactive-decision-universe.html
          grep -q "addEventListener('keydown'" interactive-decision-universe.html
      - name: Verify interactive module wiring
        run: |
          grep -q 'type="module"' interactive-decision-universe.html
          grep -q "from './research/representation.mjs'" interactive-decision-universe.html

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser automation
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Test mobile and desktop interactive journeys
        run: node tests/interactive-browser.mjs
