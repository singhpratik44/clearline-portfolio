name: APERTURE Project Control Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate imported project registry and DAG
        run: node project-control/worker.mjs
      - name: Archive execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aperture-project-control-audit
          path: project-control/worker-report.json
          if-no-files-found: warn
