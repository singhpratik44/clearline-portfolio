name: APERTURE Spatial V2 regression
on:
  push:
    paths:
      - "spatial-v2/**"
      - ".github/workflows/spatial-v2-checks.yml"
  pull_request:
    paths:
      - "spatial-v2/**"
      - ".github/workflows/spatial-v2-checks.yml"
permissions:
  contents: read
jobs:
  static-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Verify APERTURE Spatial V2
        run: node spatial-v2/verify.mjs
