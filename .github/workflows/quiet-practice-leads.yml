name: Quiet Practice public opportunity scan
on:
  schedule:
    - cron: '27 17 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: quiet-practice-leads
  cancel-in-progress: true

jobs:
  scan:
    if: github.repository == 'singhpratik44/clearline-portfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c5af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Scan public program signals and annotate review issue
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: python scripts/quiet_practice_lead_scan.py
