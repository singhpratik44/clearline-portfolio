name: Quiet Practice public opportunity scan
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quiet-practice-leads.yml'
      - 'scripts/quiet_practice_lead_scan.py'
  schedule:
    - cron: '27 17 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: quiet-practice-leads
  cancel-in-progress: true

jobs:
  scan:
    if: github.repository == 'singhpratik44/clearline-portfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5 # v5.6.0
        with:
          python-version: '3.11'
      - name: Scan public program signals and annotate review issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/quiet_practice_lead_scan.py
