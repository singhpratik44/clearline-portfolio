name: Student-athlete browser QA
on:
  push:
    paths:
      - 'student-athlete-preview/**'
      - 'tests/student-athlete.spec.cjs'
      - '.github/workflows/student-athlete-qa.yml'
  pull_request:
    paths:
      - 'student-athlete-preview/**'
      - 'tests/student-athlete.spec.cjs'
      - '.github/workflows/student-athlete-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Run tests
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          if [ "$DEVICE" = "mobile" ]; then
            npx playwright test tests/student-athlete.spec.cjs --browser chromium --workers=1 --reporter=line --config=playwright.student-athlete.config.cjs
          else
            npx playwright test tests/student-athlete.spec.cjs --browser chromium --workers=1 --reporter=line --config=playwright.student-athlete.config.cjs
          fi
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.device }}
          path: test-results/
          if-no-files-found: ignore
