name: Quiet Journey acceptance
on:
  pull_request:
    paths:
      - 'prayer/three-year/**'
      - 'tests/quiet-journey*.mjs'
      - '.github/workflows/quiet-journey-qa.yml'
  push:
    branches: [main]
    paths:
      - 'prayer/three-year/**'
      - 'tests/quiet-journey*.mjs'
      - '.github/workflows/quiet-journey-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cryptography and site invariants
        run: node --test tests/quiet-journey.test.mjs tests/quiet-journey-crypto.test.mjs tests/quiet-journey-daily.test.mjs tests/quiet-journey-commerce.test.mjs
      - name: Install isolated browser testing runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Chromium mobile and desktop journey acceptance
        run: node tests/quiet-journey-browser.mjs
