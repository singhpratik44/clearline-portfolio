name: APERTURE Browser Tests
on:
  pull_request:
    paths:
      - 'aperture-unified-command.html'
      - 'tests/aperture-command.spec.mjs'
      - 'playwright.config.mjs'
      - '.github/workflows/aperture-browser.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/aperture-command.spec.mjs
