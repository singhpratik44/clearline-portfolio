name: Publish APERTURE GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public APERTURE routes
        run: |
          test -s index.html
          test -s design/index.html
          test -s beauty/index.html
          test -s future/index.html
          test -s assets/aperture-human-experience.js
          test -s love-in-action-30/index.html
          test -s pathways/index.html
          test -s one-moment/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
