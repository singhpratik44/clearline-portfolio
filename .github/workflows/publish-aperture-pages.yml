name: Publish APERTURE GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify public APERTURE routes
        run: |
          test -s index.html
          test -s design/index.html
          test -s beauty/index.html
          test -s future/index.html
          test -s assets/aperture-human-experience.js
          test -s love-in-action-30/index.html
          test -s pathways/index.html
          test -s one-moment/index.html
          test -s sports-os/market/index.html
          test -s sports-os/market/market.js
          test -s sports-os/market/sponsors.js
      - uses: actions/configure-pages@v5
      - name: Stage verified public artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name 'sitemap.xml' -o -name 'robots.txt' \) -exec cp {} _site/ \;
          for dir in assets clearline career-os partnerships aperture learning prayer network-4d commercial-4d mission-control sports-os code-the-game coding coding-lab gifts wellness holiday lab design beauty future love-in-action-30 pathways one-moment; do
            if [ -d "$dir" ]; then cp -R "$dir" "_site/$dir"; fi
          done
          touch _site/.nojekyll
          for file in index.html 404.html curriculum.html learning-lab.html game-studio.html; do test -s "_site/$file"; done
          grep -q 'id="preview"' _site/game-studio.html
          grep -q 'id="course"' _site/learning-lab.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed sports marketplace and live sponsor links
        run: |
          python3 - <<'PY'
          import time, urllib.request
          base="https://singhpratik44.github.io/clearline-portfolio/sports-os/market/"
          checks={
              "": ('id="gift-grid"','id="moment-preview"','id="sponsor-products"','src="market.js"'),
              "market.js": ("function filterProducts(", "function approvedPlacements(", "book.stripe.com"),
              "sponsors.js": ("APERTURE_SPORTS_ADS","plink_1UbEuXRuy3ohymOHfeLD1NSL","plink_1UbEupRuy3ohymOHfqJbtvLv","plink_1UbEurRuy3ohymOHG6UCPxi0"),
              "advertising.html": ("Advertising Conditions","full refund","$49","$99","$249"),
              "technology.html": ("TheSportsDB","Sportradar","Live sport"),
              "README.md": ("Sports Market","Stripe Payment Links","Live sports licensing boundary")
          }
          for attempt in range(10):
              try:
                  for path,markers in checks.items():
                      req=urllib.request.Request(base+path,headers={'User-Agent':'APERTURE-Sports-Market-Release/1.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=15) as res:
                          content=res.read().decode('utf-8',errors='replace')
                          assert res.status==200,(path,res.status)
                          assert all(marker in content for marker in markers),("content",path)
                  print("PUBLIC SPORTS MARKETPLACE VERIFIED:",base)
                  break
              except Exception as exc:
                  print("Release verification attempt",attempt+1,repr(exc))
                  if attempt==9: raise
                  time.sleep(7)
          PY
      - name: Verify public learning routes after propagation
        run: |
          python3 - <<'PY'
          import time, urllib.request
          base='https://singhpratik44.github.io/clearline-portfolio/'
          checks=[('', 'APERTURE'),('curriculum.html','curriculum'),('learning-lab.html','id="course"'),('game-studio.html','id="preview"')]
          for attempt in range(15):
              failures=[]
              for path,marker in checks:
                  try:
                      request=urllib.request.Request(base+path,headers={'Cache-Control':'no-cache','User-Agent':'APERTURE-Pages-Release/1.0'})
                      with urllib.request.urlopen(request,timeout=15) as response:
                          page=response.read().decode('utf-8',errors='replace')
                          assert response.status==200, f'HTTP {response.status}'
                          assert marker.lower() in page.lower(), f'missing {marker}'
                          assert 'APERTURE / ROUTE NOT FOUND' not in page, 'custom 404'
                  except Exception as error:
                      failures.append(f'{path or "home"}: {error}')
              if not failures:
                  print('All public learning routes verified')
                  break
              print(f'Propagation check {attempt+1}/15: ' + '; '.join(failures),flush=True)
              if attempt==14:
                  raise RuntimeError('Public learning routes still unavailable after propagation window')
              time.sleep(12)
          PY
