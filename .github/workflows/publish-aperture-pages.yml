name: Verify published APERTURE routes
on:
  workflow_run:
    workflows: [Publish current APERTURE website]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify deployed sports marketplace and live sponsor links
        run: |
          python3 - <<'PY'
          import time, urllib.request
          base="https://singhpratik44.github.io/clearline-portfolio/sports-os/market/"
          checks={
              "": ('id="gift-grid"','id="moment-preview"','id="sponsor-products"','src="market.js"'),
              "market.js": ("function filterProducts(", "function approvedPlacements(", "book.stripe.com"),
              "sponsors.js": ("APERTURE_SPORTS_ADS","plink_1UbEuXRuy3ohymOHfeLD1NSL","plink_1UbEupRuy3ohymOHfqJbtvLv","plink_1UbEurRuy3ohymOHG6UCPxi0"),
              "advertising.html": ("Advertising Conditions","full refund","$49","$99","$249"),
              "technology.html": ("TheSportsDB","Sportradar","Live sport"),
              "README.md": ("APERTURE SPORTS — Marketplace, Moments & Ads","Stripe Payment Links","Live sports licensing boundary")
          }
          for attempt in range(10):
              try:
                  for path,markers in checks.items():
                      req=urllib.request.Request(base+path,headers={'User-Agent':'APERTURE-Sports-Market-Release/1.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=15) as res:
                          content=res.read().decode('utf-8',errors='replace')
                          assert res.status==200,(path,res.status)
                          assert all(marker in content for marker in markers),("content",path)
                  print("PUBLIC SPORTS MARKETPLACE VERIFIED:",base)
                  break
              except Exception as exc:
                  print("Release verification attempt",attempt+1,repr(exc))
                  if attempt==9: raise
                  time.sleep(7)
          PY
      - name: Verify public learning routes after propagation
        run: |
          python3 - <<'PY'
          import time, urllib.request
          base='https://singhpratik44.github.io/clearline-portfolio/'
          checks=[('', 'APERTURE'),('curriculum.html','curriculum'),('learning-lab.html','id="course"'),('game-studio.html','id="preview"')]
          for attempt in range(15):
              failures=[]
              for path,marker in checks:
                  try:
                      request=urllib.request.Request(base+path,headers={'Cache-Control':'no-cache','User-Agent':'APERTURE-Pages-Release/1.0'})
                      with urllib.request.urlopen(request,timeout=15) as response:
                          page=response.read().decode('utf-8',errors='replace')
                          assert response.status==200, f'HTTP {response.status}'
                          assert marker.lower() in page.lower(), f'missing {marker}'
                          assert 'APERTURE / ROUTE NOT FOUND' not in page, 'custom 404'
                  except Exception as error:
                      failures.append(f'{path or "home"}: {error}')
              if not failures:
                  print('All public learning routes verified')
                  break
              print(f'Propagation check {attempt+1}/15: ' + '; '.join(failures),flush=True)
              if attempt==14:
                  raise RuntimeError('Public learning routes still unavailable after propagation window')
              time.sleep(12)
          PY
