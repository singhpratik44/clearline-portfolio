name: Gift Cloud preview PNG artwork
on:
  push:
    branches: [preview/gift-cloud-independent]
    paths:
      - 'gift-cloud-static-preview/gift-preview.svg'
      - 'gift-cloud-static-preview/index.html'
      - '.github/workflows/gift-cloud-preview-image.yml'
permissions:
  contents: write
jobs:
  png:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/gift-cloud-independent
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install cairosvg
      - name: Generate 1200x630 PNG from source SVG
        run: |
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='gift-cloud-static-preview/gift-preview.svg',write_to='gift-cloud-static-preview/gift-preview.png',output_width=1200,output_height=630)
          from PIL import Image
          with Image.open('gift-cloud-static-preview/gift-preview.png') as im:
              assert im.size == (1200,630)
          PY
      - name: Commit generated image to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gift-cloud-static-preview/gift-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate PNG social preview image"
            git push origin HEAD:preview/gift-cloud-independent
          fi
