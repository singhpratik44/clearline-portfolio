name: Clearline baseline
on:
  pull_request:
  workflow_dispatch:
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build franchise engine in isolated CI workspace
        run: |
          npm install --no-save --no-package-lock react@18 react-dom@18 esbuild@0.25
          npx esbuild src/entry.jsx --bundle --minify --outfile=app.bundle.js --loader:.tsx=tsx --jsx=automatic --define:process.env.NODE_ENV='"production"'
      - name: Validate HTML and local assets
        run: node --test tests/*.mjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser smoke test desktop and iPhone viewport
        run: node tests/browser-smoke.mjs
