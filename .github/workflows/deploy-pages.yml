name: Deploy Clearline Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '45 18 * * *'
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile interactive franchise engine
        run: |
          npm install --no-save --no-package-lock react@18 react-dom@18 esbuild@0.25 playwright-core@1.55.0
          npx esbuild src/entry.jsx --bundle --minify --outfile=app.bundle.js --loader:.tsx=tsx --jsx=automatic --define:process.env.NODE_ENV='"production"'
      - name: Run regression suite
        run: node --test tests/momentum-wellness.test.mjs tests/sports-os.test.mjs tests/mission-control.test.mjs tests/commercial-planner.test.mjs tests/commercial-gmail-security.test.mjs tests/commercial-opportunities.test.mjs tests/commercial-4d.test.mjs tests/site-baseline.mjs tests/local-assets.mjs tests/decision-kernel.mjs tests/future-explorer.mjs tests/solver-router.mjs tests/world-graph.mjs tests/organization-simulator.mjs tests/information-holography.mjs
      - name: Verify APERTURE v5 mobile and desktop browser layout
        run: node --test tests/aperture-home-mobile.test.mjs
      - name: Verify holiday personalized gift sharing in Chrome
        run: node --test tests/holiday-gifting.test.mjs
      - name: Upload APERTURE v5 browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aperture-v5-browser-qa
          path: _artifacts/aperture-v5-*.png
          if-no-files-found: warn
      - name: Verify APERTURE Revenue Recovery calculations and privacy gates
        run: node --test tests/revenue-recovery.test.mjs tests/revenue-commercial.test.mjs
      - name: Verify CODE THE GAME courses, delivery and public arcade
        run: |
          node --test tests/code-the-game.test.mjs tests/code-the-game-crypto.test.mjs
      - name: Verify A Quiet Journey privacy, timeline and responsive experience
        run: node --test tests/quiet-journey.test.mjs tests/quiet-journey-crypto.test.mjs tests/quiet-journey-daily.test.mjs tests/quiet-journey-commerce.test.mjs
      - name: Test APERTURE evidence-gated application pipeline
        run: node --test career-os/tests/pipeline.test.mjs career-os/tests/educators-rising.test.mjs
      - name: Validate public research metadata adapters offline
        run: python3 -m unittest discover -s tests -p test_research_discovery.py -v
      - name: Validate APERTURE Sports ATS source safety and fail-closed logic
        run: python3 -m unittest discover -s sports-os -p test_refresh_opportunities.py -v
      - name: Benchmark bounded simulation
        run: node tests/benchmark.mjs
      - name: Build verified career prototypes
        run: |
          python3 career-os/engine/build.py
          python3 -m unittest discover -s career-os/tests -v
      - name: Independently verify current ATS postings, employer needs, and public demos
        run: |
          python3 career-os/engine/verify.py
          test -s career-os/verification.json
          python3 -c "import json; j=json.load(open('career-os/verification.json')); assert j['summary']['roles_checked'] >= 1"
      - name: Stage Pages artifact
        run: |
          mkdir -p _site
          cp *.html *.js sitemap.xml _site/
          cp -R assets clearline career-os partnerships aperture learning prayer network-4d commercial-4d mission-control sports-os code-the-game coding gifts wellness holiday _site/
          mkdir -p _site/research
          cp research/representation.mjs _site/research/
          mkdir -p _site/lab _site/src
          cp lab/index.html _site/lab/
          cp src/organization-simulator.mjs src/world-graph.mjs src/solver-router.mjs src/future-explorer.mjs src/decision-kernel.mjs src/information-holography.mjs _site/src/
          touch _site/.nojekyll
      - name: Refresh and stage APERTURE Sports employer opportunities
        run: |
          python3 sports-os/refresh_opportunities.py --output _site/sports-os/opportunities.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          feed=json.loads(Path("_site/sports-os/opportunities.json").read_text())
          assert feed["schema_version"] == 2
          assert len(feed["listings"]) >= 4
          assert all(j["status"] in ("confirmed-active", "not-found", "review-required") for j in feed["listings"])
          print("Sports source states:", feed["summary"])
          PY
      - name: Stamp and gate Educators Rising Implementation Lab release
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          page = Path('_site/career-os/demos/educators-rising-implementation-lab/index.html')
          assert page.is_file(), 'Educators Rising page missing from Pages artifact'
          html = page.read_text(encoding='utf-8')
          assert html.count('</head>') == 1, 'Ambiguous head element'
          assert html.count('id="project"') == 1
          assert html.count('id="resolve"') == 1
          assert html.count('id="reset"') == 1
          assert 'Synthetic sample data' in html and 'Not affiliated with Educators Rising' in html
          sha = os.environ['GITHUB_SHA']
          assert len(sha) == 40 and all(c in '0123456789abcdef' for c in sha)
          marker = '<meta name="aperture-educators-release-sha" content="' + sha + '">'
          assert 'aperture-educators-release-sha' not in html, 'Unexpected preexisting release stamp'
          page.write_text(html.replace('</head>', marker + '</head>', 1), encoding='utf-8')
          assert marker in page.read_text(encoding='utf-8')
          print('PASS: Educators Rising packaged release stamped at', sha)
          PY
      - name: Stamp commercial opportunity workspace release
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path=Path('_site/commercial-4d/opportunities/index.html')
          html=path.read_text()
          marker='<meta name="aperture-commercial-release-sha" content="'+os.environ['GITHUB_SHA']+'">'
          assert html.count('</head>')==1
          path.write_text(html.replace('</head>',marker+'</head>',1))
          assert marker in path.read_text()
          PY
      - name: Stamp Causal Loom release
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path=Path('_site/mission-control/index.html')
          html=path.read_text()
          marker='<meta name="aperture-mission-release-sha" content="'+os.environ['GITHUB_SHA']+'">'
          assert html.count('</head>')==1
          path.write_text(html.replace('</head>',marker+'</head>',1))
          assert marker in path.read_text()
          PY
      - name: Stamp APERTURE v5 homepage release
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path=Path('_site/index.html')
          html=path.read_text(encoding='utf-8')
          assert html.count('</head>')==1 and 'aperture-home-release-sha' not in html
          marker='<meta name="aperture-home-release-sha" content="'+os.environ['GITHUB_SHA']+'">'
          path.write_text(html.replace('</head>',marker+'</head>',1),encoding='utf-8')
          assert 'assets/aperture-v5.css' in path.read_text(encoding='utf-8')
          assert 'assets/aperture-p2.css' in path.read_text(encoding='utf-8')
          assert 'assets/aperture-p2.js' in path.read_text(encoding='utf-8')
          PY
      - name: Validate packaged site
        run: |
          test -s _site/app.bundle.js
          test -s _site/index.html
          test -s _site/assets/aperture-p2.css
          test -s _site/assets/aperture-p2.js
          test -s _site/clearline/index.html
          test -d _site/assets
          test -s _site/wellness/index.html
          test -s _site/holiday/index.html
          grep -q 'Give someone' _site/holiday/index.html
          test -s _site/code-the-game/index.html
          test -s _site/code-the-game/help/index.html
          test -s _site/code-the-game/roblox/index.html
          test -s _site/code-the-game/minecraft/index.html
          test -s _site/code-the-game/godot/index.html
          test -s _site/code-the-game/bundle/index.html
          test -s _site/code-the-game/privacy/index.html
          test -s _site/code-the-game/marketing/index.html
          test -s _site/code-the-game/start/index.html
          test -s _site/code-the-game/quiz/index.html
          test -s _site/code-the-game/playground/index.html
          test -s _site/code-the-game/learn/index.html
          test -s _site/code-the-game/learn/studio-v3.js
          test -s _site/code-the-game/learn/other-labs.js
          for p in roblox minecraft indie; do test -s "_site/code-the-game/packs/$p.json"; done
          grep -q 'code-the-game/start/' _site/sitemap.xml
          test -s _site/learning/index.html
          test -s _site/learning/site.css
          test -s _site/learning/site.js
          test -s _site/learning/subject-catalog.js
          test -s _site/learning/book/index.html
          test -s _site/learning/book/booking.js
          test -s _site/learning/book/booking.css
          test -s _site/learning/marketing/index.html
          grep -q 'id="program-grid"' _site/learning/index.html
          grep -q 'buy_btn_1Ua6avRo2jpgx3bldwAjYy0p' _site/learning/book/index.html
          test -s _site/learning/product-ui.css
          test -s _site/learning/research/index.html
          test -s _site/learning/research/TEN_STUDIES_2026.md
          grep -q 'A product should be' _site/learning/research/index.html
          node --test tests/learning-ui-research.test.mjs
          test -s _site/learning/universe/index.html
          test -s _site/learning/universe/universe.js
          test -s _site/learning/universe/universe.css
          test -s _site/learning/universe/product-ui.css
          grep -q 'id="universe-canvas"' _site/learning/universe/index.html
          grep -q 'id="chapter-slider"' _site/learning/universe/index.html
          grep -q 'learning/universe/' _site/sitemap.xml
          test -s _site/learning/catalog/index.html
          test -s _site/learning/catalog/catalog.js
          test -s _site/learning/catalog/catalog.css
          grep -q 'id="catalog"' _site/learning/catalog/index.html
          grep -q 'learning/catalog/' _site/sitemap.xml
          test -s _site/learning/studio/index.html
          test -s _site/learning/studio/studio.js
          test -s _site/learning/studio/studio.css
          test -s _site/learning/portal/index.html
          test -s _site/learning/portal/portal.js
          test -s _site/learning/portal/portal.css
          test -s _site/learning/portal/product-ui.css
          test -s _site/learning/portal/config.js
          grep -q 'enabled: false' _site/learning/portal/config.js
          grep -q 'id="system-status"' _site/learning/portal/index.html
          node --test tests/learning-portal-contract.mjs
          test -s _site/learning/projects/index.html
          test -s _site/learning/experience.js
          test -s _site/learning/experience.css
          test -s _site/prayer/index.html
          test -s _site/prayer/journey.js
          test -s _site/prayer/journey.css
          test -s _site/prayer/three-year/index.html
          test -s _site/prayer/three-year/app.js
          test -s _site/prayer/three-year/vault-crypto.mjs
          test -s _site/prayer/three-year/daily-practice.mjs
          test -s _site/prayer/three-year/daily-ui.mjs
          test -s _site/prayer/three-year/companion/shop.html
          test -s _site/prayer/three-year/companion/sample.html
          test -s _site/prayer/three-year/companion/sample.css
          test -s _site/prayer/three-year/companion/partners.html
          test -s _site/prayer/three-year/companion/partner.css
          grep -q 'href="./sample.html"' _site/prayer/three-year/companion/shop.html
          test -s _site/prayer/three-year/companion/shop.js
          test -s _site/prayer/three-year/companion/shop.css
          test -s _site/prayer/three-year/companion/checkout-config.mjs
          test -s _site/prayer/three-year/companion/workbook.html
          test -s _site/prayer/three-year/companion/workbook.js
          test -s _site/prayer/three-year/companion/workbook.css
          grep -q 'companion/shop.html' _site/sitemap.xml
          grep -q 'enabled:true' _site/prayer/three-year/companion/checkout-config.mjs
          grep -q '9B6dRbdwO3bScAcbod6kg1i' _site/prayer/three-year/companion/checkout-config.mjs
          grep -q 'https://buy.stripe.com/9B6dRbdwO3bScAcbod6kg1i' _site/prayer/three-year/companion/shop.html
          grep -q 'id="dailyRecord"' _site/prayer/three-year/index.html
          grep -q 'type="module" src="./app.js"' _site/prayer/three-year/index.html
          test -s _site/prayer/three-year/styles.css
          grep -q 'id="monthSlider"' _site/prayer/three-year/index.html
          grep -q 'buy_btn_1Ua6avRo2jpgx3bldwAjYy0p' _site/learning/index.html
          grep -q 'id="commitment"' _site/prayer/index.html
          test -s _site/career-os/index.html
          test -s _site/aperture/discovery-intake.html
          grep -q 'id="discoveryForm"' _site/aperture/discovery-intake.html
          grep -q 'function buildPrompt()' _site/aperture/discovery-intake.html
          test -s _site/commercial-4d/index.html
          test -s _site/commercial-4d/opportunities/index.html
          test -s _site/commercial-4d/opportunities/engine.js
          test -s _site/commercial-4d/opportunities/gmail-core.js
          test -s _site/mission-control/index.html
          test -s _site/mission-control/core.js
          test -s _site/mission-control/app.js
          test -s _site/mission-control/loom.js
          test -s _site/mission-control/google-calendar.js
          test -s _site/mission-control/decision-cycle.js
          test -s _site/mission-control/decision-ui.js
          test -s _site/mission-control/vault.js
          test -s _site/mission-control/research.json
          test -s _site/commercial-4d/opportunities/gmail-oauth.js
          test -s _site/commercial-4d/opportunities/vault.js
          test -s _site/commercial-4d/opportunities/audit.js
          test -s _site/commercial-4d/opportunities/secure-ui.js
          test -s _site/commercial-4d/opportunities/plan-engine.js
          test -s _site/commercial-4d/opportunities/planner-ui.js
          grep -q 'Nothing you import is uploaded' _site/commercial-4d/opportunities/index.html
          test -s _site/commercial-4d/model.js
          test -s _site/commercial-4d/research.json
          test -s _site/network-4d/index.html
          grep -q 'TIME IS THE FOURTH DIMENSION' _site/network-4d/index.html
          test -s _site/partnerships/uspa/index.html
          test -s _site/partnerships/uspa/app.js
          test -s _site/partnerships/uspa/styles.css
          test -s _site/career-os/demos/educators-rising-implementation-lab/index.html
          grep -q 'Educators Rising' _site/career-os/demos/educators-rising-implementation-lab/index.html
          grep -q 'id="resolve"' _site/career-os/demos/educators-rising-implementation-lab/index.html
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('_site/career-os/demos/educators-rising-implementation-lab/index.html')
          html=p.read_text()
          html=html.replace('</head>', '<meta name="aperture-release-sha" content="'+os.environ['GITHUB_SHA']+'"></head>', 1)
          p.write_text(html)
          assert html.count('name="aperture-release-sha"') == 1, 'Missing or duplicate release marker'
          assert os.environ['GITHUB_SHA'] in html, 'Release SHA missing from artifact'
          PY
          grep -q "aperture-release-sha" _site/career-os/demos/educators-rising-implementation-lab/index.html
          test -s _site/career-os/registry.html
          test -s _site/career-os/demos/playfly-mater-dei/index.html
          test -s _site/interactive-decision-universe.html
          test -s _site/research/representation.mjs
          grep -q "from './research/representation.mjs'" _site/interactive-decision-universe.html
          node --test research/representation.test.mjs
          node --test tests/coaching-journey.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: clearline-preview-site
          path: _site
      - if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry_2.outputs.page_url || steps.deployment_retry_3.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        name: Deploy Pages (first attempt)
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait for overlapping Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 50
      - id: deployment_retry_2
        name: Retry Pages deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before final Pages attempt
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_2.outcome == 'failure'
        run: sleep 90
      - id: deployment_retry_3
        name: Final Pages deployment attempt
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Require successful Pages deployment
        if: always()
        env:
          A: ${{ steps.deployment.outcome }}
          B: ${{ steps.deployment_retry_2.outcome }}
          C: ${{ steps.deployment_retry_3.outcome }}
        run: |
          if [[ "$A" != "success" && "$B" != "success" && "$C" != "success" ]]; then
            echo "All Pages deployment attempts failed"
            exit 1
          fi
          echo "Pages deployment accepted"
      - name: Verify published APERTURE Sports Career OS
        run: |
          python3 - <<'PY'
          import time, urllib.request
          base = "https://singhpratik44.github.io/clearline-portfolio/sports-os/"
          checks = {
              "index.html": ("APERTURE SPORTS", "id=\"career-graph\"", 'src="app.js"', "PUBLIC SANDBOX"),
              "app.js": ("roleData", "renderEvidence", "buildPractice", "renderCapacity"),
              "opportunities.html": ("Opportunity Intelligence", "id=\"job-list\"", "opportunities.js"),
              "opportunities.js": ("confirmed-active", "render", "official_url"),
              "profile.html": ("Professional Portfolio Builder", "id=\"profile-form\"", "profile.js"),
              "profile.js": ("self-reported-unverified", "htmlExport", "secureLink"),
              "marketplace.html": ("Services Studio", "id=\"scope-form\"", "marketplace.js"),
              "marketplace.js": ("PROPOSED STATEMENT OF WORK", "No outreach", "services"),
              "opportunities.json": ('"schema_version": 2', '"listings":', '"status":'),
              "revenue-recovery/index.html": ("REVENUE RECOVERY", 'id="signal-rows"', 'src="engine.js"'),
              "revenue-recovery/engine.js": ("function analyze(", "function proposal(", "function parseCsv(", "executed:false"),
              "revenue-recovery/pilot.html": ("14-Day Revenue Diagnostic", 'id="intake-form"', 'src="pilot.js"'),
              "revenue-recovery/pilot.js": ("function evaluate(", "function compose(", "No email, payment"),
              "revenue-recovery/sample-audit.html": ("FICTIONAL SAMPLE DATA", "$1,054", "NOT RECOVERED MONEY"),
              "revenue-recovery/prospects.html": ("Buyer Intelligence", 'id="top-prospects"', 'src="prospects.js"'),
              "revenue-recovery/prospects.js": ("function score(", "function rank(", "UNSENT DRAFT"),
              "revenue-recovery/prospects-2026-11-10.json": ('"schema_version": 1', '"records":', '"pain_verified": false')
          }
          for attempt in range(10):
              try:
                  for path, markers in checks.items():
                      req = urllib.request.Request(base + path, headers={'User-Agent':'APERTURE-Sports-Release-Check/1.0'})
                      with urllib.request.urlopen(req,timeout=16) as response:
                          body = response.read().decode('utf-8',errors='replace')
                          assert response.status == 200 and all(marker in body for marker in markers),path
                  print("LIVE VERIFIED APERTURE SPORTS",base)
                  break
              except Exception as exc:
                  print("Sports release verification",attempt+1,repr(exc))
                  if attempt == 9:raise
                  time.sleep(8)
          PY
      - name: Verify published Educators Rising demo
        env:
          DEMO_URL: https://singhpratik44.github.io/clearline-portfolio/career-os/demos/educators-rising-implementation-lab/
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, time, urllib.request, json, datetime, pathlib
          url = os.environ['DEMO_URL']
          for attempt in range(12):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'APERTURE-Pages-Deployment-Check/1.0'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read().decode('utf-8', errors='replace')
                      if response.status == 200 and all(token in body for token in ('Educators Rising', 'id="resolve"', 'function render()', 'name="aperture-release-sha" content="'+os.environ['EXPECTED_SHA']+'"')):
                          print('LIVE VERIFIED:', url)
                          pathlib.Path('release-evidence.json').write_text(json.dumps({'status':'LIVE_VERIFIED','url':url,'commit_sha':os.environ['EXPECTED_SHA'],'http_status':response.status,'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'checks':['employer identity','resolve control','render function','exact deployed release SHA'],'interaction_tests':'See build job: career-os/tests/educators-rising.test.mjs','browser_interaction_verified':False},indent=2))
                          break
                      print('Published page not ready:', response.status)
              except Exception as exc:
                  print('Attempt', attempt + 1, type(exc).__name__, str(exc))
              if attempt == 11:
                  raise SystemExit('Published prototype not independently verified after 12 attempts')
              time.sleep(15)
          PY

      - name: Upload verified release receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: educators-rising-release-receipt
          path: release-evidence.json
          if-no-files-found: error
      - name: Verify published commercial opportunity workspace
        env:
          COMMERCIAL_URL: https://singhpratik44.github.io/clearline-portfolio/commercial-4d/opportunities/
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os,time,urllib.request
          root=os.environ['COMMERCIAL_URL']
          expected=os.environ['EXPECTED_SHA']
          expected_marker='name="aperture-commercial-release-sha" content="'+expected+'"'
          paths={'':(expected_marker,'Import private opportunities JSON','id="connect-google"','id="save-vault"','src="./secure-ui.js"','src="./planner-ui.js"','id="commercial-plan-studio"'),
                 'engine.js':('AP4DOpportunity','terms_confirmed'),
                 'gmail-core.js':('AP4DGmailCore','message_ids'),
                 'gmail-oauth.js':('AP4DGmail','gmail.readonly'),
                 'vault.js':('AP4DVault','AES-GCM'),
                 'audit.js':('AP4DAudit','proposal_reviewed'),
                 'secure-ui.js':('AP4DSecureUI','saveEncrypted'),
                 'plan-engine.js':('AP4DPlan','execution_authorized:false'),
                 'planner-ui.js':('AP4DPlannerUI','plan-studies')}
          for attempt in range(12):
              try:
                  for suffix,tokens in paths.items():
                      request=urllib.request.Request(root+suffix,headers={'User-Agent':'APERTURE-Pages-Commercial-Release/1.0'})
                      with urllib.request.urlopen(request,timeout=15) as response:
                          text=response.read().decode('utf-8')
                          assert response.status==200,(suffix,response.status)
