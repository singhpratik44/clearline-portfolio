name: Deploy Clearline Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '45 18 * * *'
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile interactive franchise engine
        run: |
          npm install --no-save --no-package-lock react@18 react-dom@18 esbuild@0.25
          npx esbuild src/entry.jsx --bundle --minify --outfile=app.bundle.js --loader:.tsx=tsx --jsx=automatic --define:process.env.NODE_ENV='"production"'
      - name: Run regression suite
        run: node --test tests/site-baseline.mjs tests/local-assets.mjs tests/decision-kernel.mjs tests/future-explorer.mjs tests/solver-router.mjs tests/world-graph.mjs tests/organization-simulator.mjs tests/information-holography.mjs
      - name: Test APERTURE evidence-gated application pipeline
        run: node --test career-os/tests/pipeline.test.mjs career-os/tests/educators-rising.test.mjs
      - name: Benchmark bounded simulation
        run: node tests/benchmark.mjs
      - name: Build verified career prototypes
        run: |
          python3 career-os/engine/build.py
          python3 -m unittest discover -s career-os/tests -v
      - name: Independently verify current ATS postings, employer needs, and public demos
        run: |
          python3 career-os/engine/verify.py
          test -s career-os/verification.json
          python3 -c "import json; j=json.load(open('career-os/verification.json')); assert j['summary']['roles_checked'] >= 1"
      - name: Stage Pages artifact
        run: |
          mkdir -p _site
          cp *.html *.js _site/
          cp -R assets clearline career-os partnerships aperture _site/
          mkdir -p _site/research
          cp research/representation.mjs _site/research/
          mkdir -p _site/lab _site/src
          cp lab/index.html _site/lab/
          cp src/organization-simulator.mjs src/world-graph.mjs src/solver-router.mjs src/future-explorer.mjs src/decision-kernel.mjs src/information-holography.mjs _site/src/
          touch _site/.nojekyll
      - name: Validate packaged site
        run: |
          test -s _site/app.bundle.js
          test -s _site/index.html
          test -s _site/clearline/index.html
          test -d _site/assets
          test -s _site/career-os/index.html
          test -s _site/aperture/discovery-intake.html
          grep -q 'id="discoveryForm"' _site/aperture/discovery-intake.html
          grep -q 'function buildPrompt()' _site/aperture/discovery-intake.html
          test -s _site/partnerships/uspa/index.html
          test -s _site/partnerships/uspa/app.js
          test -s _site/partnerships/uspa/styles.css
          test -s _site/career-os/demos/educators-rising-implementation-lab/index.html
          grep -q 'Educators Rising' _site/career-os/demos/educators-rising-implementation-lab/index.html
          grep -q 'id="resolve"' _site/career-os/demos/educators-rising-implementation-lab/index.html
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('_site/career-os/demos/educators-rising-implementation-lab/index.html')
          html=p.read_text()
          html=html.replace('</head>', '<meta name="aperture-release-sha" content="'+os.environ['GITHUB_SHA']+'"></head>', 1)
          p.write_text(html)
          assert html.count('name="aperture-release-sha"') == 1, 'Missing or duplicate release marker'
          assert os.environ['GITHUB_SHA'] in html, 'Release SHA missing from artifact'
          PY
          grep -q "aperture-release-sha" _site/career-os/demos/educators-rising-implementation-lab/index.html
          test -s _site/career-os/registry.html
          test -s _site/career-os/demos/playfly-mater-dei/index.html
          test -s _site/interactive-decision-universe.html
          test -s _site/research/representation.mjs
          grep -q "from './research/representation.mjs'" _site/interactive-decision-universe.html
          node --test research/representation.test.mjs
          node --test tests/coaching-journey.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: clearline-preview-site
          path: _site
      - if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Educators Rising demo
        env:
          DEMO_URL: https://singhpratik44.github.io/clearline-portfolio/career-os/demos/educators-rising-implementation-lab/
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, time, urllib.request, json, datetime, pathlib
          url = os.environ['DEMO_URL']
          for attempt in range(12):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'APERTURE-Pages-Deployment-Check/1.0'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read().decode('utf-8', errors='replace')
                      if response.status == 200 and all(token in body for token in ('Educators Rising', 'id="resolve"', 'function render()', 'name="aperture-release-sha" content="'+os.environ['EXPECTED_SHA']+'"')):
                          print('LIVE VERIFIED:', url)
                          pathlib.Path('release-evidence.json').write_text(json.dumps({'status':'LIVE_VERIFIED','url':url,'commit_sha':os.environ['EXPECTED_SHA'],'http_status':response.status,'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'checks':['employer identity','resolve control','render function','exact deployed release SHA'],'interaction_tests':'See build job: career-os/tests/educators-rising.test.mjs','browser_interaction_verified':False},indent=2))
                          break
                      print('Published page not ready:', response.status)
              except Exception as exc:
                  print('Attempt', attempt + 1, type(exc).__name__, str(exc))
              if attempt == 11:
                  raise SystemExit('Published prototype not independently verified after 12 attempts')
              time.sleep(15)
          PY

      - name: Upload verified release receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: educators-rising-release-receipt
          path: release-evidence.json
          if-no-files-found: error
