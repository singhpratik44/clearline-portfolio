name: APERTURE Gift Studio MCP test
on:
  push:
    paths:
      - "chatgpt-gift-studio/**"
      - ".github/workflows/aperture-gift-plugin-ci.yml"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --omit=dev
        working-directory: chatgpt-gift-studio
      - run: node --check server.mjs
        working-directory: chatgpt-gift-studio
      - run: node test.mjs
        working-directory: chatgpt-gift-studio
      - name: Dependency audit (high severity blocks release)
        run: npm audit --omit=dev --audit-level=high
        working-directory: chatgpt-gift-studio
  production:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --omit=dev
        working-directory: chatgpt-gift-studio
      - run: node test-production.mjs
        working-directory: chatgpt-gift-studio

  mobile-browser:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save @playwright/test
        working-directory: chatgpt-gift-studio
      - run: npx playwright install --with-deps chromium
        working-directory: chatgpt-gift-studio
      - run: npx playwright test digital-twin.mobile.spec.mjs --reporter=line
        working-directory: chatgpt-gift-studio
