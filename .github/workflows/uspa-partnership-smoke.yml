name: USPA Partnership Lab Smoke
on:
  push:
    paths:
      - 'partnerships/uspa/**'
      - '.github/workflows/uspa-partnership-smoke.yml'
  pull_request:
    paths:
      - 'partnerships/uspa/**'
      - '.github/workflows/uspa-partnership-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: node --check partnerships/uspa/app.js
      - name: Run static smoke checks
        run: node partnerships/uspa/tests/smoke.cjs
