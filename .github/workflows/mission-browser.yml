name: APERTURE Causal Loom Browser QA
on:
  push:
    branches: [main]
    paths:
      - 'mission-control/**'
      - 'tests/mission-control.browser.mjs'
      - '.github/workflows/mission-browser.yml'
  pull_request:
    paths:
      - 'mission-control/**'
      - 'tests/mission-control.browser.mjs'
      - '.github/workflows/mission-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
      - name: Verify mobile and desktop Causal Loom meeting/task/vault flows
        run: node tests/mission-control.browser.mjs
