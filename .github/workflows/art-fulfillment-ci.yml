name: Clearline Art private delivery tests
on:
  push:
    paths:
      - 'art-fulfillment/**'
      - 'gifts/fulfillment/art.mjs'
      - 'gifts/fulfillment/server.mjs'
      - 'tests/art-fulfillment.test.mjs'
      - '.github/workflows/art-fulfillment-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  payments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check gifts/fulfillment/art.mjs
      - run: node --check gifts/fulfillment/server.mjs
      - run: node --test tests/art-fulfillment.test.mjs
  private-bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r art-fulfillment/requirements.txt
      - run: python art-fulfillment/build.py
      - run: python art-fulfillment/test_art.py
