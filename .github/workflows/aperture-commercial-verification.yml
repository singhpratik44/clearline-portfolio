name: APERTURE commercial verification
on:
  pull_request:
    paths:
      - 'aperture/workbench/**'
      - 'aperture/commercialize/**'
      - 'tests/aperture-*.test.mjs'
      - '.github/workflows/aperture-commercial-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run five-module and commercial tests
        run: node --test tests/aperture-workbench.test.mjs tests/aperture-commercial.test.mjs
      - name: Check no secret keys in public pages
        run: |
          if grep -En 'sk_live_|sk_test_' aperture/workbench/index.html aperture/commercialize/index.html; then
            echo "Secret key pattern found"; exit 1
          fi
