<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APERTURE | Five Module Workbench</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#0b1220;color:#eaf1ff}*{box-sizing:border-box}body{margin:0;max-width:1120px;padding:24px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0}nav{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}button,input,select{font:inherit;border-radius:8px;padding:10px;background:#1d304c;color:white;border:1px solid #466183}button{cursor:pointer}button:focus-visible{outline:3px solid #91d7ff}.active{background:#206ca6}.panel{background:#142238;border:1px solid #304560;padding:22px;border-radius:14px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{padding:16px;background:#1b2c44;border-radius:10px}small,.muted{color:#b5c6da}label{display:block;margin:10px 0}input{max-width:100%}output{display:block;margin:12px 0;font-weight:bold}.warning{color:#ffd48c}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #3d536c;padding:9px}a{color:#9edbff}</style></head><body>
<header><div><small>APERTURE ∞ / governed execution</small><h1>Mission Control</h1></div><small>Local demonstration · No live trading or payments</small></header>
<nav aria-label="Modules" id="tabs"></nav><main id="main" aria-live="polite"></main>
<script>
"use strict";
const sections=["Core Platform","Education Lab","Market Command","Sales Engine","Agent Operations"];
const defaults={tasks:[{id:"evidence",name:"Verify evidence",deps:[],done:false},{id:"curriculum",name:"Review curriculum",deps:["evidence"],done:false},{id:"publish",name:"Approve publication",deps:["curriculum"],done:false}],ledger:[],cart:[],quiz:null};
let state;
try{state=Object.assign({},defaults,JSON.parse(localStorage.getItem("aperture-demo-v1")||"{}"));if(!Array.isArray(state.tasks)||!Array.isArray(state.ledger)||!Array.isArray(state.cart))throw Error("Invalid saved data")}catch{state=structuredClone(defaults)}
let active=sections[0];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){localStorage.setItem("aperture-demo-v1",JSON.stringify(state))}
function record(action,detail){state.ledger.unshift({at:new Date().toISOString(),action,detail});save()}
function ready(task){return task.deps.every(d=>state.tasks.some(t=>t.id===d&&t.done))}
function toggleTask(id){const t=state.tasks.find(x=>x.id===id);if(!t||(!t.done&&!ready(t)))return; if(t.done&&state.tasks.some(x=>x.deps.includes(id)&&x.done))return;t.done=!t.done;record("TASK",t.name+": "+(t.done?"completed":"reopened"));render()}
function setTab(s){active=s;render()}
function core(){return '<div class="panel"><h2>Dependency-gated execution</h2><p>Complete prerequisites before dependent actions unlock. Completed tasks cannot be reopened while a dependent task remains complete.</p>'+state.tasks.map(t=>'<div class="card"><button '+(!t.done&&!ready(t)?"disabled":"")+' data-task="'+esc(t.id)+'">'+(t.done?"✓ Reopen":"Complete")+'</button> '+esc(t.name)+' <small>Depends on: '+esc(t.deps.join(", ")||"none")+'</small></div>').join("")+'</div>'}
const lessons=[["Scratch","Sequencing","Which block repeats an action?","repeat","wait"],["Python","Variables","Which statement assigns a value?","score = 3","score == 3"],["Robotics","Sensors","What measures distance?","ultrasonic sensor","LED"]];
function education(){return '<div class="panel"><h2>Interactive learning checks</h2><p>Three sample lessons. No student information is transmitted.</p><div class="grid">'+lessons.map((l,i)=>'<div class="card"><h3>'+l[0]+'</h3><p>'+l[1]+': '+l[2]+'</p><button data-answer="'+i+':0">'+esc(l[3])+'</button> <button data-answer="'+i+':1">'+esc(l[4])+'</button></div>').join("")+'</div><output>'+esc(state.quiz||"Choose an answer to check mastery.")+'</output></div>'}
function market(){return '<div class="panel"><h2>Risk budget simulator</h2><p class="warning">Illustrative arithmetic only; no quotes, broker access, order placement, or guaranteed stop fills.</p><label>Capital ($) <input id="capital" type="number" min="0" step=".01" value="50"></label><label>Entry price ($) <input id="entry" type="number" min=".01" step=".01" value="1"></label><label>Stop price ($) <input id="stop" type="number" min="0" step=".01" value=".95"></label><label>Estimated round-trip costs ($) <input id="cost" type="number" min="0" step=".01" value=".20"></label><label>Intended loss budget ($) <input id="budget" type="number" min="0" step=".01" value="2"></label><button id="calculate">Calculate maximum whole shares</button><output id="risk">Enter assumptions and calculate.</output></div>'}
const offers=[{id:"sprint",name:"AI Workflow Sprint",price:500},{id:"path",name:"30-day Pathway",price:15},{id:"room",name:"Own the Room",price:29}];
function sales(){let total=state.cart.reduce((sum,id)=>sum+(offers.find(o=>o.id===id)?.price||0),0);return '<div class="panel"><h2>Sales Engine · demo catalog</h2><p>No checkout integration. Prices are illustrative catalog values and no charge is made.</p><div class="grid">'+offers.map(o=>'<div class="card"><h3>'+esc(o.name)+'</h3><p>$'+o.price+'</p><button data-add="'+o.id+'">Add to demo cart</button></div>').join("")+'</div><output>Cart: '+state.cart.length+' items · $'+total.toFixed(2)+'</output><button id="clear-cart">Clear cart</button></div>'}
function agents(){return '<div class="panel"><h2>Agent Operations</h2><p>Proposal-only registry. These are specifications, not running agents. Approval is recorded locally and never triggers external action.</p><div class="grid">'+["Research","Curriculum QA","Market Risk","Sales Review","Release QA"].map(n=>'<div class="card"><h3>'+n+'</h3><p>Status: inactive · human authorization required</p><button data-propose="'+n+'">Create review proposal</button></div>').join("")+'</div></div><div class="panel"><h2>Local evidence ledger</h2><button id="export">Export JSON</button><table><thead><tr><th>UTC</th><th>Action</th><th>Detail</th></tr></thead><tbody>'+state.ledger.slice(0,30).map(e=>'<tr><td>'+esc(e.at)+'</td><td>'+esc(e.action)+'</td><td>'+esc(e.detail)+'</td></tr>').join("")+'</tbody></table></div>'}
function render(){document.getElementById("tabs").innerHTML=sections.map(s=>'<button class="'+(s===active?"active":"")+'" data-tab="'+esc(s)+'" aria-current="'+(s===active?"page":"false")+'">'+esc(s)+'</button>').join("");document.getElementById("main").innerHTML=({[sections[0]]:core,[sections[1]]:education,[sections[2]]:market,[sections[3]]:sales,[sections[4]]:agents})[active]()}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.tab)setTab(b.dataset.tab);if(b.dataset.task)toggleTask(b.dataset.task);if(b.dataset.answer){const [i,j]=b.dataset.answer.split(":").map(Number);state.quiz=(j===0?"Correct: ":"Try again: ")+lessons[i][1];record("LEARNING",state.quiz);render()}if(b.dataset.add){state.cart.push(b.dataset.add);record("CART","Added "+b.dataset.add);render()}if(b.id==="clear-cart"){state.cart=[];record("CART","Cleared demo cart");render()}if(b.dataset.propose){record("PROPOSAL",b.dataset.propose+" review requested; no action executed");render()}if(b.id==="calculate"){const nums=["capital","entry","stop","cost","budget"].map(id=>Number(document.getElementById(id).value));const [capital,entry,stop,cost,budget]=nums;let msg;if(nums.some(n=>!Number.isFinite(n))||capital<0||entry<=0||stop<0||stop>=entry||cost<0||budget<0)msg="Invalid assumptions: require 0 ≤ stop < entry and nonnegative costs and budget.";else{const shares=Math.max(0,Math.min(Math.floor(capital/entry),Math.floor(Math.max(0,budget-cost)/(entry-stop))));msg=shares+" shares; notional $"+(shares*entry).toFixed(2)+"; modeled loss $"+(shares*(entry-stop)+cost).toFixed(2)+". Real gaps/slippage can exceed this."}document.getElementById("risk").textContent=msg}if(b.id==="export"){const blob=new Blob([JSON.stringify(state.ledger,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="aperture-evidence.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
render();
</script></body></html>
